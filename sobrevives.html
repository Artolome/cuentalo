<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobrevives</title>
<meta name="description" content="Sobrevives — juego de narración visual en español (A1/A2). Maqueta fase 0.">
<style>
:root{
  --papel:#fff8ec; --papel2:#f6e9d2; --tinta:#1f1a17; --tinta2:#5b4a3a;
  --rojo:#c4432e; --verde:#4c8748; --azul:#2c5a9a; --amarillo:#dfa92c; --celeste:#86b3d4; --marron:#8b5a3c;
  --ok:#2e8b57; --borde:#1f1a17;
  --f-titulo: "Trebuchet MS","Segoe UI",Verdana,sans-serif;
  --f-texto: "Segoe UI",Verdana,Tahoma,sans-serif;
  --base:18px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f-texto);font-size:var(--base);color:var(--tinta);background:var(--papel2);
  background-image:radial-gradient(rgba(120,85,35,.08) 1px,transparent 1.4px);background-size:7px 7px;display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.btn{border:2.5px solid var(--borde);background:var(--papel);border-radius:999px;padding:.35em .95em;box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:700;font-size:1rem;line-height:1.2}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.sec{background:var(--papel2);font-weight:600}
.btn.rojo{background:var(--rojo);color:#fff6e6}
.btn.verde{background:var(--ok);color:#fff6e6}
/* ---------- cabecera ---------- */
#cab{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid var(--borde);background:var(--papel)}
#cab h1{margin:0;font-family:var(--f-titulo);font-size:1.5rem;letter-spacing:.04em;flex:1}
#cab h1 small{font-weight:400;font-size:.7em;color:var(--tinta2);margin-left:.6em}
#cab .acciones{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- juego ---------- */
#juego{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 16px 8px;max-width:1500px;width:100%;margin:0 auto}
#titulo{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.titulo{font-family:var(--f-titulo);font-size:clamp(1.6rem,3.4vw,2.6rem);font-weight:900;border:3px solid var(--borde);background:var(--papel);
  border-radius:16px;padding:.25em .8em;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:background .3s,color .3s}
.titulo.ok{background:var(--ok);color:#fff6e6}
.titulo .alt{font-size:.5em;font-weight:500;opacity:.8;margin-left:.6em}
#estadoNivel{font-weight:700;color:var(--tinta2);font-size:1.1rem;min-width:8em}
#estadoNivel.ok{color:var(--ok)}
/* tira de viñetas */
#tira{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.vineta{width:min(100%, var(--ancho-vineta, 380px), calc((100vh - 400px) * 1.45));min-width:230px;display:flex;flex-direction:column;background:var(--papel);border:3px solid var(--borde);border-radius:12px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.vineta .num{position:absolute;left:8px;top:6px;z-index:3;font-family:var(--f-titulo);font-weight:900;font-size:1.1rem;background:var(--papel);border:2px solid var(--borde);border-radius:50%;width:1.7em;height:1.7em;display:flex;align-items:center;justify-content:center}
.escena-caja{position:relative;aspect-ratio:16/10;background:#e9e2d2;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-bottom:3px solid var(--borde)}
.escena-caja.vacia{background:repeating-linear-gradient(45deg,#ece4d4 0 12px,#e3d9c6 12px 24px)}
.escena-caja.vacia::after{content:"Arrastra una escena aquí";position:absolute;inset:auto 0 42% 0;text-align:center;color:var(--tinta2);font-style:italic;font-size:1rem}
.escena-caja > svg.fondo{position:absolute;inset:0;width:100%;height:100%}
.escena-caja .personajes{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:4%;width:100%;height:100%;padding:0 6% 2%}
.escena-caja .personajes.vacia{pointer-events:none}
.pj{height:78%;width:auto;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35));cursor:pointer;transition:transform .15s}
.pj:hover{transform:scale(1.04)}
.escena-caja .quitar{position:absolute;right:6px;top:6px;z-index:3;width:1.7em;height:1.7em;border-radius:50%;border:2px solid var(--borde);background:var(--papel);font-weight:900;line-height:1;padding:0}
.escena-caja.sobre{outline:5px solid var(--amarillo);outline-offset:-5px}
.vineta .frase{margin:0;padding:10px 12px;min-height:3.4em;font-size:1.1rem;line-height:1.3;cursor:pointer;background:var(--papel)}
.vineta .frase:hover{background:#fff}
.vineta .frase.vacia{color:var(--tinta2);font-style:italic}
.vineta .frase.alerta{color:var(--rojo);font-weight:700}
/* stock */
#stock{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:10px 28px;border-top:3px dashed rgba(0,0,0,.25);padding-top:10px}
.stock-fila{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
#stockPersonajes{padding-left:28px;border-left:3px dashed rgba(0,0,0,.25)}
.carta{display:flex;flex-direction:column;align-items:center;gap:4px;width:108px;padding:5px;border:3px solid var(--borde);border-radius:12px;background:var(--papel);box-shadow:0 4px 0 rgba(0,0,0,.3);cursor:grab;user-select:none;transition:transform .12s}
.escena-caja:focus-visible{outline:5px solid var(--azul);outline-offset:-5px}
.carta:hover{transform:translateY(-3px)}
.carta.sel{outline:5px solid var(--amarillo);outline-offset:1px;transform:translateY(-4px)}
.carta svg{width:100%;height:auto;border-radius:6px;border:2px solid var(--borde);background:#fff}
.carta .nom{font-weight:700;font-size:1rem;text-align:center;line-height:1.1}
.ficha{width:104px;padding-bottom:6px}
.ficha svg{height:76px;width:auto;border:none;background:transparent}
.ficha .nom{font-size:1.05rem}
.ficha.lucia{border-color:#e2558c}.ficha.mateo{border-color:#2c5a9a}.ficha.valeria{border-color:#dfa92c}.ficha.diego{border-color:#7a3b9e}.ficha.kiwi{border-color:#4c8748}
/* paneles laterales */
.panel{position:fixed;top:0;bottom:0;width:min(420px,92vw);background:var(--papel);border-right:3px solid var(--borde);box-shadow:6px 0 0 rgba(0,0,0,.2);z-index:20;overflow:auto;padding:14px 16px}
#panelNiveles{left:0}
#panelLexico{right:0;left:auto;border-right:none;border-left:3px solid var(--borde);box-shadow:-6px 0 0 rgba(0,0,0,.2)}
.panel h2{font-family:var(--f-titulo);margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}
.panel h3{margin:14px 0 6px;color:var(--tinta2);font-size:1rem;text-transform:uppercase;letter-spacing:.08em}
.niv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--borde);border-radius:10px;background:var(--papel);padding:8px 10px;margin:5px 0;font-size:1.05rem}
.niv .estrellas{margin-left:auto;font-size:1.1rem;letter-spacing:.05em}
.niv.actual{background:#fff3c4}
.niv.hecho{border-color:var(--ok)}
.lex{display:flex;flex-wrap:wrap;gap:8px}
.lex button{border:2px solid var(--borde);border-radius:999px;background:var(--papel);padding:.25em .7em .25em .5em;font-size:1.05rem;display:flex;gap:.4em;align-items:center}
/* diálogos */
dialog{border:3px solid var(--borde);border-radius:16px;background:var(--papel);color:var(--tinta);padding:18px 22px;max-width:min(760px,94vw);box-shadow:0 8px 0 rgba(0,0,0,.35);font-size:1.1rem}
dialog::backdrop{background:rgba(30,20,10,.55)}
dialog h2{font-family:var(--f-titulo);margin:0 0 10px}
dialog .historia p{margin:.3em 0;cursor:pointer;padding:.2em .4em;border-radius:6px}
dialog .historia p:hover{background:#fff}
dialog .historia p b{display:inline-block;width:1.6em;color:var(--tinta2)}
dialog .porque{margin-top:10px;padding:10px 12px;border:2px dashed var(--rojo);border-radius:10px;color:var(--rojo);font-weight:700}
dialog .porque.ok{border-color:var(--ok);color:var(--ok)}
dialog .fila{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#dlgExito{text-align:center}
#dlgExito .grande{font-size:3rem;margin:6px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:.6em 1.2em;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
footer{text-align:center;font-size:.85rem;color:var(--tinta2);padding:6px}
footer a{color:inherit}
@media (max-width:720px){ :root{--base:16px} #cab h1 small{display:none} .vineta{--ancho-vineta:100%} }
@media print{ #cab,#stock,footer,.quitar,.num,.panel{display:none!important} body{background:#fff} .vineta{box-shadow:none;break-inside:avoid} }
</style>
</head>
<body>
<header id="cab">
  <button id="btnNiveles" class="btn sec" title="Elegir nivel">☰ Niveles</button>
  <h1>Sobrevives <small id="subcap"></small></h1>
  <div class="acciones">
    <button id="btnPista" class="btn sec">💡 Pista</button>
    <button id="btnLexico" class="btn sec">📖 Léxico</button>
    <button id="btnQuePasa" class="btn">¿Qué pasa?</button>
    <button id="btnReiniciar" class="btn sec" title="Vaciar las viñetas">↺</button>
  </div>
</header>
<main id="juego">
  <section id="titulo">
    <button id="tituloTxt" class="titulo" title="Escuchar el título"></button>
    <span id="estadoNivel"></span>
  </section>
  <section id="tira" aria-label="Viñetas"></section>
  <section id="stock" aria-label="Escenas y personajes">
    <div id="stockEscenas" class="stock-fila"></div>
    <div id="stockPersonajes" class="stock-fila"></div>
  </section>
</main>
<aside id="panelNiveles" class="panel" hidden></aside>
<aside id="panelLexico" class="panel" hidden></aside>
<dialog id="dlgQuePasa"></dialog>
<dialog id="dlgExito"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<footer>Sobrevives · maqueta fase 0 · 2026-10-06 · sin conexión · ningún dato sale de este ordenador</footer>
<script>/* lengua.js */
/* Sobrevives — capa de lengua (sin DOM).
   Acuerdos de género/número, sujetos compuestos, conjugación presente / pretérito.
   Funciona en Node (tests) y en el navegador (window.SVLengua). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SVLengua = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- adjetivos ----------
     base = masculino singular. 'inv' = invariable en género. */
  const ADJ = {
    cansado: { f: 'cansada', pl: 'cansados', fpl: 'cansadas' },
    herido: { f: 'herida', pl: 'heridos', fpl: 'heridas' },
    perdido: { f: 'perdida', pl: 'perdidos', fpl: 'perdidas' },
    solo: { f: 'sola', pl: 'solos', fpl: 'solas' },
    enfadado: { f: 'enfadada', pl: 'enfadados', fpl: 'enfadadas' },
    tranquilo: { f: 'tranquila', pl: 'tranquilos', fpl: 'tranquilas' },
    mojado: { f: 'mojada', pl: 'mojados', fpl: 'mojadas' },
    contento: { f: 'contenta', pl: 'contentos', fpl: 'contentas' },
    juntos: { f: 'juntos', pl: 'juntos', fpl: 'juntas' },
    triste: { f: 'triste', pl: 'tristes', fpl: 'tristes' },
    'a salvo': { f: 'a salvo', pl: 'a salvo', fpl: 'a salvo' },
    nuevo: { f: 'nueva', pl: 'nuevos', fpl: 'nuevas' }
  };

  /** acuerdo('cansado', {g:'f', n:'pl'}) → 'cansadas' */
  function acuerdo(adj, gn) {
    const forms = ADJ[adj];
    if (!forms) return adj;
    const g = gn.g === 'f' ? 'f' : 'm', n = gn.n === 'pl' ? 'pl' : 'sg';
    if (n === 'sg') return g === 'f' ? forms.f : adj;
    return g === 'f' ? forms.fpl : forms.pl;
  }

  /** género-número de un grupo de personajes [{nombre, genero}] */
  function gn(personajes) {
    const list = Array.isArray(personajes) ? personajes : [personajes];
    const n = list.length > 1 ? 'pl' : 'sg';
    const g = list.every(p => p.genero === 'f') ? 'f' : 'm';
    return { g, n };
  }

  /** "Lucía" · "Lucía y Mateo" · "Lucía, Mateo y Diego" */
  function sujeto(personajes) {
    const list = Array.isArray(personajes) ? personajes : [personajes];
    const names = list.map(p => p.nombre);
    if (names.length === 1) return names[0];
    if (names.length === 2) return names[0] + ' y ' + names[1];
    return names.slice(0, -1).join(', ') + ' y ' + names[names.length - 1];
  }

  /* ---------- verbos ----------
     Formas de 3.ª persona: [sg, pl] en presente y en «pretérito» (modo relato de 3e).
     Regla del modo pretérito (DECISIONS.md §6): las ACCIONES van en indefinido (caminó, bebió, encontró…)
     y los ESTADOS y los MARCOS van en imperfecto (tenía, estaba, seguía, podía · llovía, hacía calor, era de noche, había).
     Es el contraste passé composé / imparfait que se enseña en A2. */
  const V = {
    caminar: { pres: ['camina', 'caminan'], pret: ['caminó', 'caminaron'] },
    perderse: { pres: ['se pierde', 'se pierden'], pret: ['se perdió', 'se perdieron'] },
    encontrar: { pres: ['encuentra', 'encuentran'], pret: ['encontró', 'encontraron'] },
    encontrarse: { pres: ['se encuentra', 'se encuentran'], pret: ['se encontró', 'se encontraron'] },
    beber: { pres: ['bebe', 'beben'], pret: ['bebió', 'bebieron'] },
    cruzar: { pres: ['cruza', 'cruzan'], pret: ['cruzó', 'cruzaron'] },
    mojarse: { pres: ['se moja', 'se mojan'], pret: ['se mojó', 'se mojaron'] },
    tener: { pres: ['tiene', 'tienen'], pret: ['tenía', 'tenían'], estado: true },
    estar: { pres: ['está', 'están'], pret: ['estaba', 'estaban'], estado: true },
    poder: { pres: ['puede', 'pueden'], pret: ['podía', 'podían'], estado: true },
    ser: { pres: ['es', 'son'], pret: ['fue', 'fueron'] },
    seguir: { pres: ['sigue', 'siguen'], pret: ['seguía', 'seguían'], estado: true },
    salvarse: { pres: ['se salva', 'se salvan'], pret: ['se salvó', 'se salvaron'] },
    dormir: { pres: ['duerme', 'duermen'], pret: ['durmió', 'durmieron'] },
    comer: { pres: ['come', 'comen'], pret: ['comió', 'comieron'] },
    guardar: { pres: ['guarda', 'guardan'], pret: ['guardó', 'guardaron'] },
    compartir: { pres: ['comparte', 'comparten'], pret: ['compartió', 'compartieron'] },
    descansar: { pres: ['descansa', 'descansan'], pret: ['descansó', 'descansaron'] },
    curar: { pres: ['cura', 'curan'], pret: ['curó', 'curaron'] },
    pedir: { pres: ['pide', 'piden'], pret: ['pidió', 'pidieron'] },
    subir: { pres: ['sube', 'suben'], pret: ['subió', 'subieron'] },
    ver: { pres: ['ve', 'ven'], pret: ['vio', 'vieron'] },
    gritar: { pres: ['grita', 'gritan'], pret: ['gritó', 'gritaron'] },
    correr: { pres: ['corre', 'corren'], pret: ['corrió', 'corrieron'] },
    morder: { pres: ['muerde', 'muerden'], pret: ['mordió', 'mordieron'] },
    irse: { pres: ['se va', 'se van'], pret: ['se fue', 'se fueron'] },
    llegar: { pres: ['llega', 'llegan'], pret: ['llegó', 'llegaron'] },
    encender: { pres: ['enciende', 'encienden'], pret: ['encendió', 'encendieron'] },
    taparse: { pres: ['se tapa', 'se tapan'], pret: ['se tapó', 'se taparon'] },
    avisar: { pres: ['avisa', 'avisan'], pret: ['avisó', 'avisaron'] },
    hacer: { pres: ['hace', 'hacen'], pret: ['hizo', 'hicieron'] },
    llover: { pres: ['llueve', 'llueve'], pret: ['llovía', 'llovía'], imp: true },
    hacerImp: { pres: ['hace', 'hace'], pret: ['hacía', 'hacía'], imp: true },
    serImp: { pres: ['es', 'es'], pret: ['era', 'era'], imp: true },
    haber: { pres: ['hay', 'hay'], pret: ['había', 'había'], imp: true }
  };

  /** conj('tener', {n:'pl'}, 'pret') → 'tuvieron' */
  function conj(lema, gn, tiempo) {
    const v = V[lema];
    if (!v) throw new Error('verbo desconocido: ' + lema);
    const i = gn && gn.n === 'pl' ? 1 : 0;
    return (tiempo === 'pret' ? v.pret : v.pres)[i];
  }

  /** Mayúscula inicial respetando «¡» y «¿». */
  function cap(s) {
    const m = s.match(/^([¡¿]*)(.)(.*)$/s);
    return m ? m[1] + m[2].toUpperCase() + m[3] : s;
  }

  /** Une frases con espacio, limpiando dobles espacios. */
  function unir(frases) {
    return frases.filter(Boolean).map(s => s.trim()).join(' ').replace(/\s+/g, ' ');
  }

  /* Pictos (emoji) del léxico, por lema. Se usan en el panel «Léxico». */
  const PICTOS = {
    selva: '🌴', río: '🌊', sol: '🌞', tormenta: '⛈️', noche: '🌙', jaguar: '🐆', serpiente: '🐍',
    frutas: '🍌', fuego: '🔥', refugio: '🏕️', montaña: '⛰️', mapa: '🗺️', mochila: '🎒', cuerda: '🪢',
    manta: '🧣', linterna: '🔦', helicóptero: '🚁', comida: '🍞', agua: '💧',
    hambre: '🍽️', sed: '🥤', frío: '🥶', miedo: '😨', cansado: '😴', herido: '🤕', perdido: '❓',
    'a salvo': '🛟', amigos: '🤝', enfadado: '😠', contento: '😊', triste: '😢', solo: '🧍', juntos: '🧑‍🤝‍🧑', tranquilo: '😌',
    caminar: '🚶', beber: '🥤', comer: '🍴', dormir: '💤', encontrar: '🔍', cruzar: '🌉', correr: '🏃',
    gritar: '📣', compartir: '🤲', curar: '🩹', descansar: '🛌', subir: '🧗', ver: '👀', llover: '🌧️',
    'hacer calor': '🌡️', 'pedir perdón': '🙏', guardar: '📦', encender: '💡', morder: '🦷', avisar: '✋'
  };

  return { ADJ, V, PICTOS, acuerdo, gn, sujeto, conj, cap, unir };
});

</script>
<script>/* contenido.js */
/* Sobrevives — contenido (datos puros, sin DOM).
   Personajes, escenas (metadatos), niveles. Las reglas de las escenas viven en engine.js. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SVContenido = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- Personajes ----------
     Procedencia: Lucía (Sobrevive · Charlemos), Mateo · Valeria · Diego (Charlemos), Kiwi el loro (Charlemos, mascota).
     color = color dominante de la silueta; accesorio = lo que lo hace reconocible de lejos. */
  const PERSONAJES = [
    { id: 'lucia', nombre: 'Lucía', genero: 'f', edad: 13, rasgo: 'alegre: canta siempre', accesorio: 'gorra rosa', color: '#e2558c', piel: '#8b5a3c', pelo: '#1f1a17' },
    { id: 'mateo', nombre: 'Mateo', genero: 'm', edad: 13, rasgo: 'siempre tiene hambre', accesorio: 'camiseta de fútbol azul', color: '#2c5a9a', piel: '#c98f62', pelo: '#1f1a17' },
    { id: 'valeria', nombre: 'Valeria', genero: 'f', edad: 14, rasgo: 'valiente: la exploradora', accesorio: 'cámara de fotos', color: '#dfa92c', piel: '#c98f62', pelo: '#1f1a17' },
    { id: 'diego', nombre: 'Diego', genero: 'm', edad: 15, rasgo: 'miedoso, pero cuenta historias', accesorio: 'cuaderno de dibujo', color: '#7a3b9e', piel: '#e7b78a', pelo: '#8b5a3c' },
    { id: 'kiwi', nombre: 'Kiwi', genero: 'm', animal: true, rasgo: 'el loro de Lucía: vuela y ve todo', accesorio: 'plumas verdes', color: '#4c8748', piel: '#4c8748', pelo: '#c4432e' }
  ];

  /* ---------- Estados ----------
     Booleanos por personaje. 'contento' es derivado (ningún estado negativo). */
  const ESTADOS = [
    { id: 'hambre', frase: 'tener hambre', tipo: 'tener', negativo: true },
    { id: 'sed', frase: 'tener sed', tipo: 'tener', negativo: true },
    { id: 'frio', frase: 'tener frío', tipo: 'tener', palabra: 'frío', negativo: true },
    { id: 'miedo', frase: 'tener miedo', tipo: 'tener', negativo: true },
    { id: 'cansado', frase: 'estar cansado/a', tipo: 'estar', negativo: true },

<script>/* engine.js */
/* Sobrevives — motor puro y determinista (sin DOM). Funciona en Node y en el navegador (window.SVEngine).
   simular(nivel, viñetas, opts) → { viñetas:[{frases, eventos}], estado, eventos, resuelto, secreto, porque, valido, incompleto }
   resolver(nivel, opts)        → { total, soluciones:[...], secretas, ambas, estados }
   tituloDe(objetivo, nivel)    → título en español generado desde el predicado
*/
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./lengua.js'), require('./contenido.js'));
  else root.SVEngine = factory(root.SVLengua, root.SVContenido);
})(typeof self !== 'undefined' ? self : this, function (L, C) {
  'use strict';

  const NEGATIVOS = ['hambre', 'sed', 'frio', 'miedo', 'cansado', 'herido', 'perdido'];
  const POR_ID = {};
  for (const p of C.PERSONAJES) POR_ID[p.id] = p;
  const ESCENA = {};
  for (const e of C.ESCENAS) ESCENA[e.id] = e;
  const ORDEN = {};
  C.PERSONAJES.forEach((p, i) => { ORDEN[p.id] = i; });

  const P = id => POR_ID[id];
  const Ps = ids => ids.map(P);
  const ordenar = ids => ids.slice().sort((a, b) => ORDEN[a] - ORDEN[b]);

  /* ---------- estado ---------- */
  function estadoInicial(nivel) {
    const S = {};
    for (const id of nivel.personajes) {
      S[id] = { hambre: false, sed: false, frio: false, miedo: false, cansado: false, herido: false, perdido: false, salvo: false,
        objetos: {}, amigos: {}, enfadado: {} };
      const ini = nivel.inicial && nivel.inicial[id];
      if (ini) {
        for (const k in ini) {
          if (k === 'objetos') for (const o of ini.objetos) S[id].objetos[o] = true;
          else S[id][k] = ini[k];
        }
      }
    }
    return S;
  }
  function clonar(S) {
    const T = {};
    for (const id in S) {
      const s = S[id];
      T[id] = Object.assign({}, s, { objetos: Object.assign({}, s.objetos), amigos: Object.assign({}, s.amigos), enfadado: Object.assign({}, s.enfadado) });
    }
    return T;
  }
  function contento(s) {
    return !NEGATIVOS.some(k => s[k]) && Object.keys(s.enfadado).length === 0;
  }
  function valor(s, estado) {
    if (estado === 'contento') return contento(s);
    return !!s[estado];
  }
  /** Expresión de la cara según el estado (prioridad). */
  function expresion(s) {
    if (s.salvo) return 'feliz';
    if (s.herido) return 'herido';
    if (s.miedo) return 'miedo';
    if (Object.keys(s.enfadado).length) return 'enfadado';
    if (s.perdido) return 'perdido';
    if (s.frio) return 'frio';
    if (s.hambre) return 'hambre';
    if (s.sed) return 'sed';
    if (s.cansado) return 'cansado';
    return 'contento';
  }

  /* ---------- paso: aplica una viñeta ----------
     ctx = { S, hist:{alguna:{id:{estado:true}}, eventos:[], invalido:false}, tiempo } */
  function paso(ctx, panel, indice) {
    const S = ctx.S, ids = ordenar(panel.personajes || []), esc = panel.escena;
    const evs = [];
    const ev = (tipo, datos) => { const e = Object.assign({ tipo, viñeta: indice, escena: esc }, datos || {}); evs.push(e); ctx.hist.eventos.push(e); };
    const marca = () => { for (const id of ids) for (const k of NEGATIVOS) if (S[id][k]) ctx.hist.alguna[id][k] = true; };
    const set = (id, k, v) => { S[id][k] = v; if (v && NEGATIVOS.includes(k)) ctx.hist.alguna[id][k] = true; };
    const haceAmigos = () => { if (ids.length === 2) { S[ids[0]].amigos[ids[1]] = true; S[ids[1]].amigos[ids[0]] = true; } };
    const tiene = (id, o) => !!S[id].objetos[o];
    const alguienTiene = o => ids.some(id => tiene(id, o));
    const quienes = k => ids.filter(id => S[id][k]);

    if (!esc || !ids.length) return evs; // viñeta incompleta
    for (const id of ids) ctx.hist.salen[id] = true;

    // 0. Un personaje ya a salvo no puede seguir en la historia.
    const yaSalvo = ids.filter(id => S[id].salvo);
    if (yaSalvo.length) { ctx.hist.invalido = true; for (const id of yaSalvo) ev('yaSalvo', { quien: id }); return evs; }

    // 1. Juntos: el que no está perdido encuentra al perdido.
    if (ids.length === 2) {
      const perdidos = quienes('perdido');
      if (perdidos.length === 1) {
        const a = perdidos[0], q = ids.find(id => id !== a);
        set(a, 'perdido', false); ev('encuentra', { quien: q, a, lugar: esc });
      } else if (perdidos.length === 2) {
        for (const id of ids) set(id, 'perdido', false);
        ev('seEncuentran', { quienes: ids, lugar: esc });
      }
    }
    const encontrado = evs.length > 0;
    let amigos = ids.length === 2; // por defecto, compartir viñeta = amigos (salvo «come solo»)

    switch (esc) {
      case 'selva': {
        if (ids.length === 1) {
          const id = ids[0];
          if (tiene(id, 'mapa')) ev('noPierde', { quien: id });
          else { set(id, 'perdido', true); ev('pierde', { quien: id }); }
        } else if (!encontrado) {
          for (const id of ids) { set(id, 'hambre', true); set(id, 'cansado', true); }
          ev('caminanJuntos', { quienes: ids });
        }
        break;
      }
      case 'rio': {
        const sed = quienes('sed');
        for (const id of ids) set(id, 'sed', false);
        ev('bebe', { quienes: ids, sed });
        if (alguienTiene('cuerda')) ev('cruzaCuerda', { quienes: ids });
        else { for (const id of ids) set(id, 'frio', true); ev('cruzaMojado', { quienes: ids }); }
        break;
      }
      case 'sol': {
        for (const id of ids) set(id, 'sed', true);
        ev('calor', { quienes: ids });
        break;
      }
      case 'tormenta': {
        const manta = alguienTiene('manta'), solo = ids.length === 1;
        if (!manta) for (const id of ids) set(id, 'frio', true);
        if (solo) set(ids[0], 'miedo', true);
        ev('tormenta', { quienes: ids, manta, solo });
        break;
      }
      case 'noche': {
        if (ids.length === 1) {
          const id = ids[0];
          if (tiene(id, 'linterna')) { set(id, 'miedo', false); ev('nocheLinterna', { quien: id }); }
          else { set(id, 'miedo', true); ev('nocheSolo', { quien: id }); }
        } else {
          const cansados = quienes('cansado'), miedos = quienes('miedo');
          for (const id of ids) { set(id, 'cansado', false); set(id, 'miedo', false); }
          ev('nocheJuntos', { quienes: ids, cansados, miedos });
        }
        break;
      }
      case 'jaguar': {
        if (ids.length === 1) {
          const id = ids[0], mapa = tiene(id, 'mapa');
          set(id, 'miedo', true);
          if (!mapa) set(id, 'perdido', true);
          ev('jaguarSolo', { quien: id, mapa });
        } else ev('jaguarJuntos', { quienes: ids });
        break;
      }
      case 'serpiente': {
        if (ids.length === 1) { set(ids[0], 'herido', true); ev('serpienteMuerde', { quien: ids[0] }); }
        else ev('serpienteAvisa', { quien: ids[0], a: ids[1] });
        break;
      }
      case 'frutas': {
        const hambre = quienes('hambre');
        for (const id of ids) set(id, 'hambre', false);
        ev('comeFrutas', { quienes: ids, hambre });
        break;
      }
      case 'fuego': {
        const frio = quienes('frio');
        for (const id of ids) set(id, 'frio', false);
        // comida: se decide antes de emitir «hace fuego» para acortar esa frase si sigue otra
        const con = ids.filter(id => tiene(id, 'comida')), hambre = quienes('hambre');
        const comida = [];
        if (ids.length === 1) {
          if (con.length && hambre.length) { set(ids[0], 'hambre', false); comida.push(['comeComida', { quien: ids[0] }]); }
        } else if (con.length === 2 || con.length === 0) {
          if (con.length && hambre.length) { for (const id of ids) set(id, 'hambre', false); comida.push(['comen', { quienes: ids }]); }
        } else {
          const x = con[0], y = ids.find(id => id !== x);
          if (S[y].hambre) {
            if (S[x].amigos[y] && !S[y].enfadado[x] && !S[x].enfadado[y]) {
              for (const id of ids) set(id, 'hambre', false); comida.push(['comparte', { quien: x, a: y }]);
            } else {
              set(x, 'hambre', false); S[y].enfadado[x] = true; amigos = false; comida.push(['comeSolo', { quien: x, a: y }]);
            }
          } else if (S[x].hambre) { set(x, 'hambre', false); comida.push(['comeComida', { quien: x }]); }
        }
        ev('fuego', { quienes: ids, frio, breve: comida.length > 0 });
        for (const [t, d] of comida) ev(t, d);
        break;
      }
      case 'refugio': {
        const cansados = quienes('cansado'), miedos = quienes('miedo');
        for (const id of ids) { set(id, 'cansado', false); set(id, 'miedo', false); }
        const extra = [];
        if (ids.length === 2) {
          const heridos = quienes('herido');
          if (heridos.length === 1) { const a = heridos[0], q = ids.find(id => id !== a); set(a, 'herido', false); extra.push(['cura', { quien: q, a }]); }
          else if (heridos.length === 2) { for (const id of ids) set(id, 'herido', false); extra.push(['seCuran', { quienes: ids }]); }
          for (const y of ids) { const x = ids.find(id => id !== y); if (S[y].enfadado[x]) { delete S[y].enfadado[x]; extra.push(['perdon', { quien: x, a: y }]); } }
        }
        ev('descansa', { quienes: ids, cansados, miedos, breve: extra.length > 0 });
        for (const [t, d] of extra) ev(t, d);
        break;
      }
      case 'montana': {
        const perdidos = quienes('perdido');
        for (const id of ids) { set(id, 'cansado', true); set(id, 'hambre', true); set(id, 'perdido', false); }
        ev('montana', { quienes: ids, perdidos });
        break;
      }
      case 'mapa': { const id = ids[0], perdido = S[id].perdido; set(id, 'perdido', false); S[id].objetos.mapa = true; ev('mapa', { quien: id, perdido }); break; }
      case 'mochila': { const id = ids[0], hambre = S[id].hambre; set(id, 'hambre', false); S[id].objetos.comida = true; ev('mochila', { quien: id, hambre }); break; }
      case 'cuerda': { const id = ids[0]; S[id].objetos.cuerda = true; ev('cuerda', { quien: id }); break; }
      case 'manta': { const id = ids[0], frio = S[id].frio; set(id, 'frio', false); S[id].objetos.manta = true; ev('manta', { quien: id, frio }); break; }
      case 'linterna': { const id = ids[0], miedo = S[id].miedo; set(id, 'miedo', false); S[id].objetos.linterna = true; ev('linterna', { quien: id, miedo }); break; }
      case 'rescate': {
        const perdidos = quienes('perdido'); // solo posible con 1 personaje (a dos ya se han encontrado)
        if (perdidos.length) ev('rescateNoVe', { quien: perdidos[0] });
        else { for (const id of ids) set(id, 'salvo', true); ev('rescate', { quienes: ids }); }
        break;
      }
      default: throw new Error('escena desconocida: ' + esc);
    }
    if (amigos) haceAmigos();
    marca();
    return evs;
  }

  /* ---------- frases ---------- */
  function frasesDe(e, tiempo) {
    const t = tiempo === 'pret' ? 'pret' : 'pres';
    const V = (lema, ids) => L.conj(lema, L.gn(Ps(ids)), t);
    const Vi = lema => L.conj(lema, { n: 'sg' }, t);
    const A = (adj, ids) => L.acuerdo(adj, L.gn(Ps(ids)));
    const N = ids => L.sujeto(Ps(ids));
    const q = e.quien ? [e.quien] : null, qs = e.quienes || null, a = e.a ? [e.a] : null;
    const yaNo = (ids, k) => k === 'tener' ? `Ya no ${V('tener', ids)}` : `Ya no ${V('estar', ids)}`;
    const lugar = e.lugar === 'selva' ? ' en la selva' : ''; // las demás escenas ya nombran el sitio en su propia frase
    switch (e.tipo) {
      case 'yaSalvo': return [`¡Pero ${N(q)} ya ${V('estar', q)} a salvo! No ${V('poder', q)} estar aquí.`];
      case 'encuentra': return [`${N(q)} ${V('encontrar', q)} a ${N(a)}${lugar}. ¡Qué alegría!`];
      case 'seEncuentran': return [`${N(qs)} ${V('encontrarse', qs)}${lugar}. ${yaNo(qs, 'estar')} ${A('perdido', qs)}.`];
      case 'pierde': return [`${N(q)} ${V('caminar', q)} ${A('solo', q)} por la selva y ${V('perderse', q)}.`];
      case 'noPierde': return [`${N(q)} ${V('caminar', q)} por la selva. ${L.cap(V('tener', q))} el mapa y no ${V('perderse', q)}.`];
      case 'caminanJuntos': return [`${N(qs)} ${V('caminar', qs)} ${A('juntos', qs)} por la selva. ${L.cap(V('tener', qs))} hambre y ${V('estar', qs)} ${A('cansado', qs)}.`];
      case 'bebe': {
        const f = `${N(qs)} ${V('beber', qs)} agua del río.`;
        if (!e.sed.length) return [f];
        if (e.sed.length === qs.length) return [f, `${yaNo(qs, 'tener')} sed.`];
        return [f, `${N(e.sed)} ya no ${V('tener', e.sed)} sed.`];
      }
      case 'cruzaMojado': return [`${L.cap(V('cruzar', qs))} el río y ${V('mojarse', qs)}. ${L.cap(V('tener', qs))} frío.`];
      case 'cruzaCuerda': return [`${L.cap(V('cruzar', qs))} el río con la cuerda. No ${V('mojarse', qs)}.`];
      case 'calor': return [`${L.cap(Vi('hacerImp'))} mucho calor.`, `${N(qs)} ${V('tener', qs)} sed.`];
      case 'tormenta': {
        const ll = `${L.cap(Vi('llover'))} mucho.`;
        if (e.solo) {
          if (e.manta) return [ll, `${N(qs)} ${V('taparse', qs)} con la manta y no ${V('tener', qs)} frío.`, `Pero ${V('estar', qs)} ${A('solo', qs)} y ${V('tener', qs)} miedo.`];
          return [ll, `${N(qs)} ${V('tener', qs)} frío y miedo.`];
        }
        if (e.manta) return [ll, `${N(qs)} ${V('taparse', qs)} con la manta. No ${V('tener', qs)} frío.`];
        return [ll, `${N(qs)} ${V('tener', qs)} frío.`];
      }
      case 'nocheSolo': return [`${L.cap(Vi('serImp'))} de noche. ${N(q)} ${V('estar', q)} ${A('solo', q)} y ${V('tener', q)} miedo.`];
      case 'nocheLinterna': return [`${L.cap(Vi('serImp'))} de noche. ${N(q)} ${V('encender', q)} la linterna y ${V('dormir', q)} ${A('tranquilo', q)}.`];
      case 'nocheJuntos': {
        const f = `${L.cap(Vi('serImp'))} de noche. ${N(qs)} ${V('estar', qs)} ${A('juntos', qs)} y ${V('dormir', qs)} bien.`;
        if (e.cansados.length === qs.length) return [f, `${yaNo(qs, 'estar')} ${A('cansado', qs)}.`];
        if (e.cansados.length) return [f, `${N(e.cansados)} ya no ${V('estar', e.cansados)} ${A('cansado', e.cansados)}.`];
        if (e.miedos.length) return [f, `${yaNo(qs, 'tener')} miedo.`];
        return [f, `No ${V('tener', qs)} miedo.`];
      }
      case 'jaguarSolo': {
        const f = `¡Un jaguar! ${N(q)} ${V('tener', q)} miedo y ${V('correr', q)}.`;
        return [f, e.mapa ? `Con el mapa, no ${V('perderse', q)}.` : `${L.cap(V('perderse', q))}.`];
      }
      case 'jaguarJuntos': return [`¡Un jaguar! ${N(qs)} ${V('gritar', qs)} ${A('juntos', qs)} y el jaguar ${Vi('irse')}.`];
      case 'serpienteMuerde': return [`¡Ay! Una serpiente ${Vi('morder')} a ${N(q)}. ${L.cap(V('estar', q))} ${A('herido', q)}.`];
      case 'serpienteAvisa': return [`${N(q)} ${V('ver', q)} una serpiente y ${V('avisar', q)} a ${N(a)}. ¡Cuidado! La serpiente no ${Vi('morder')} a nadie.`];
      case 'comeFrutas': {
        const f = `${N(qs)} ${V('comer', qs)} frutas.`;
        if (!e.hambre.length) return [f, '¡Qué ricas!'];
        if (e.hambre.length === qs.length) return [f, `${yaNo(qs, 'tener')} hambre.`];
        return [f, `${N(e.hambre)} ya no ${V('tener', e.hambre)} hambre.`];
      }
      case 'fuego': {
        const f = `${N(qs)} ${V('hacer', qs)} fuego.`;
        if (!e.frio.length) return e.breve ? [f] : [f, '¡Qué bien!'];
        if (e.frio.length === qs.length) return [f, `${yaNo(qs, 'tener')} frío.`];
        return [f, `${N(e.frio)} ya no ${V('tener', e.frio)} frío.`];
      }
      // comeComida / comen / seCuran siguen siempre a una frase con el mismo sujeto (fuego, refugio): se omite el sujeto
      case 'comeComida': return [`${L.cap(V('comer', q))} y ya no ${V('tener', q)} hambre.`];
      case 'comen': return [`${L.cap(V('comer', qs))} y ya no ${V('tener', qs)} hambre.`];
      case 'comparte': return [`${N(q)} ${V('compartir', q)} la comida con ${N(a)}. ${yaNo([e.quien, e.a], 'tener')} hambre.`];
      case 'comeSolo': return [`${N(q)} ${V('comer', q)} y no ${V('compartir', q)}. ${N(a)} ${V('tener', a)} hambre y ${V('estar', a)} ${A('enfadado', a)} con ${N(q)}.`];
      case 'descansa': {
        const f = `${N(qs)} ${V('descansar', qs)} en el refugio.`;
        if (e.breve) return [f];
        if (e.cansados.length === qs.length) return [f, `${yaNo(qs, 'estar')} ${A('cansado', qs)}.`];
        if (e.cansados.length) return [f, `${N(e.cansados)} ya no ${V('estar', e.cansados)} ${A('cansado', e.cansados)}.`];
        if (e.miedos.length) return [f, `${yaNo(qs, 'tener')} miedo.`];
        return [f, `${L.cap(V('estar', qs))} ${A('tranquilo', qs)}.`];
      }
      case 'cura': return [`${N(q)} ${V('curar', q)} a ${N(a)}. ${N(a)} ya no ${V('estar', a)} ${A('herido', a)}.`];
      case 'seCuran': return [`${t === 'pret' ? 'Se curaron' : 'Se curan'}. ${yaNo(qs, 'estar')} ${A('herido', qs)}.`];
      case 'perdon': return [`${N(q)} ${V('pedir', q)} perdón a ${N(a)}. ${N(a)} ya no ${V('estar', a)} ${A('enfadado', a)}.`];
      case 'montana': {
        const f = `${N(qs)} ${V('subir', qs)} la montaña. ${L.cap(V('estar', qs))} ${A('cansado', qs)} y ${V('tener', qs)} hambre.`;
        if (e.perdidos.length) return [f, `Desde arriba ${V('ver', e.perdidos)} el río. ¡Ya no ${V('estar', e.perdidos)} ${A('perdido', e.perdidos)}!`];
        return [f];
      }
      case 'mapa': return e.perdido ? [`${N(q)} ${V('encontrar', q)} el mapa. ¡Ya no ${V('estar', q)} ${A('perdido', q)}!`] : [`${N(q)} ${V('encontrar', q)} un mapa. Lo ${V('guardar', q)}.`];
      case 'mochila': return e.hambre ? [`${N(q)} ${V('encontrar', q)} una mochila con comida. ${L.cap(V('comer', q))} y ya no ${V('tener', q)} hambre.`] : [`${N(q)} ${V('encontrar', q)} una mochila con comida. ¡Qué suerte!`];
      case 'cuerda': return [`${N(q)} ${V('encontrar', q)} una cuerda. La ${V('guardar', q)}.`];
      case 'manta': return e.frio ? [`${N(q)} ${V('encontrar', q)} una manta. ${yaNo(q, 'tener')} frío.`] : [`${N(q)} ${V('encontrar', q)} una manta. La ${V('guardar', q)}.`];
      case 'linterna': return e.miedo ? [`${N(q)} ${V('encontrar', q)} una linterna. ${yaNo(q, 'tener')} miedo.`] : [`${N(q)} ${V('encontrar', q)} una linterna. La ${V('guardar', q)}.`];
      case 'rescate': return [t === 'pret' ? `¡El helicóptero! ${N(qs)} ${V('salvarse', qs)}.` : `¡El helicóptero! ${N(qs)} ${V('estar', qs)} a salvo.`];
      case 'rescateNoVe': return [`El helicóptero no ${Vi('ver')} a ${N(q)}. ${N(q)} todavía ${V('estar', q)} ${A('perdido', q)}.`];
      default: return ['…'];
    }
  }

  /* Léxico que puede aparecer en cada escena (lemas), para el panel «Léxico». */
  const LEXICO_ESCENA = {
    selva: ['selva', 'caminar', 'solo', 'perdido', 'encontrar', 'juntos', 'hambre', 'cansado', 'amigos'],
    rio: ['río', 'agua', 'beber', 'sed', 'cruzar', 'frío', 'cuerda'],
    sol: ['sol', 'hacer calor', 'sed'],
    tormenta: ['tormenta', 'llover', 'frío', 'miedo', 'manta', 'solo'],
    noche: ['noche', 'solo', 'miedo', 'linterna', 'dormir', 'juntos', 'cansado'],
    jaguar: ['jaguar', 'miedo', 'correr', 'perdido', 'gritar', 'juntos'],
    serpiente: ['serpiente', 'morder', 'herido', 'ver', 'avisar'],
    frutas: ['frutas', 'comer', 'hambre'],
    fuego: ['fuego', 'frío', 'comer', 'hambre', 'comida', 'compartir', 'solo', 'enfadado', 'amigos'],
    refugio: ['refugio', 'descansar', 'cansado', 'miedo', 'curar', 'herido', 'pedir perdón', 'enfadado'],
    montana: ['montaña', 'subir', 'cansado', 'hambre', 'ver', 'río', 'perdido'],
    mapa: ['mapa', 'encontrar', 'perdido', 'guardar', 'mochila'],
    mochila: ['mochila', 'comida', 'encontrar', 'comer', 'hambre'],
    cuerda: ['cuerda', 'encontrar', 'guardar'],
    manta: ['manta', 'encontrar', 'frío', 'guardar'],
    linterna: ['linterna', 'encontrar', 'miedo', 'guardar'],
    rescate: ['helicóptero', 'a salvo', 'ver', 'perdido']
  };
  function lexicoDe(nivel) {
    const set = new Set();
    for (const e of nivel.escenas) for (const w of LEXICO_ESCENA[e] || []) set.add(w);
    return [...set].map(w => ({ palabra: w, picto: L.PICTOS[w] || '' }));
  }

  /* ---------- objetivos ---------- */
  const ESTADO_INFO = {};
  for (const e of C.ESTADOS) ESTADO_INFO[e.id] = e;
  const PALABRA = { hambre: 'hambre', sed: 'sed', frio: 'frío', miedo: 'miedo', cansado: 'cansado', herido: 'herido', perdido: 'perdido', salvo: 'a salvo', contento: 'contento' };

  function humanos(nivel) { return nivel.personajes.filter(id => !P(id).animal); }

  function evaluar(obj, res, nivel) {
    if (!obj) return false;
    const S = res.estado, H = res.hist;
    switch (obj.tipo) {
      case 'estado': return valor(S[obj.quien], obj.estado) === (obj.valor !== false);
      case 'yaNo': return !!(H.alguna[obj.quien] && H.alguna[obj.quien][obj.estado]) && !valor(S[obj.quien], obj.estado);
      case 'todos': return humanos(nivel).every(id => valor(S[id], obj.estado) === (obj.valor !== false));
      case 'nadie': return humanos(nivel).every(id => !valor(S[id], obj.estado));
      case 'nunca': {
        const ids = obj.quien ? [obj.quien] : humanos(nivel);
        return ids.every(id => !(H.alguna[id] && H.alguna[id][obj.estado]) && !valor(S[id], obj.estado));
      }
      case 'evento': return H.eventos.some(e => e.tipo === obj.evento && (!obj.quien || e.quien === obj.quien || (e.quienes && e.quienes.includes(obj.quien))) && (!obj.a || e.a === obj.a || (e.quienes && e.quienes.includes(obj.a))));
      case 'amigos': return !!S[obj.a].amigos[obj.b];
      case 'enfadado': return !!S[obj.quien].enfadado[obj.con];
      case 'y': return obj.partes.every(p => evaluar(p, res, nivel));
      default: return false;
    }
  }

  /** Frase verbal de un estado para un grupo: «tiene hambre» · «está perdida» · «están a salvo».
      gnForzado permite imponer el plural («Todos están…»); adverbio se intercala tras el verbo («está nunca perdido»). */
  function fraseEstado(estado, ids, tiempo, negar, gnForzado, adverbio) {
    const gn = gnForzado || L.gn(Ps(ids)), t = tiempo || 'pres';
    const info = ESTADO_INFO[estado];
    const no = negar ? 'no ' : '', adv = adverbio ? adverbio + ' ' : '';
    if (info.tipo === 'tener') return `${no}${L.conj('tener', gn, t)} ${adv}${PALABRA[estado]}`;
    const adj = estado === 'salvo' ? 'a salvo' : estado;
    return `${no}${L.conj('estar', gn, t)} ${adv}${L.acuerdo(adj, gn)}`;
  }
  /** Solo el complemento del estado: «hambre» · «perdidos» · «a salvo» (para fusionar títulos) */
  function complementoEstado(estado, gn) {
    if (ESTADO_INFO[estado].tipo === 'tener') return PALABRA[estado];
    return L.acuerdo(estado === 'salvo' ? 'a salvo' : estado, gn);
  }

  /* Títulos generados para los eventos. q / a pueden faltar (título secreto genérico). */
  const N1 = id => P(id).nombre;
  const Nq = (q, defecto) => q ? N1(q) : defecto;
  const acq = (adj, q) => q ? L.acuerdo(adj, L.gn(P(q))) : adj;
  const TITULO_EVENTO = {
    encuentra: (q, a) => `${Nq(q, 'Alguien')} encuentra a ${Nq(a, 'un amigo')}`,
    seEncuentran: (q, a) => q && a ? `${N1(q)} y ${N1(a)} se encuentran` : 'Dos amigos se encuentran',
    cura: (q, a) => `${Nq(q, 'Alguien')} cura a ${Nq(a, 'un amigo')}`,
    comparte: (q, a) => a ? `${Nq(q, 'Alguien')} comparte la comida con ${N1(a)}` : `${Nq(q, 'Alguien')} comparte la comida`,
    comeSolo: q => `${Nq(q, 'Alguien')} no comparte`,
    nocheLinterna: q => `${Nq(q, 'Alguien')} duerme ${acq('tranquilo', q)}`,
    jaguarJuntos: () => 'El jaguar se va',
    jaguarSolo: q => `¡Un jaguar! ${Nq(q, 'Alguien')} corre`,
    caminanJuntos: (q, a) => q && a ? `${N1(q)} y ${N1(a)} caminan juntos` : 'Caminan juntos',
    nocheJuntos: (q, a) => q && a ? `${N1(q)} y ${N1(a)} duermen bien` : 'Nadie duerme solo',
    perdon: (q, a) => `${Nq(q, 'Alguien')} pide perdón a ${Nq(a, 'un amigo')}`,
    cruzaCuerda: (q, a) => q && a ? `${N1(q)} y ${N1(a)} cruzan el río con la cuerda` : q ? `${N1(q)} cruza el río con la cuerda` : 'Cruzan el río con la cuerda',
    serpienteAvisa: (q, a) => a ? `¡Cuidado, ${N1(a)}!` : '¡Cuidado con la serpiente!',
    rescateNoVe: q => `El helicóptero no ve a ${Nq(q, 'alguien')}`
  };

  function tituloDe(obj, nivel) {
    if (!obj) return '';
    switch (obj.tipo) {
      case 'estado': return L.cap(`${N1(obj.quien)} ${fraseEstado(obj.estado, [obj.quien], 'pres', obj.valor === false)}`);
      case 'yaNo': return L.cap(`${N1(obj.quien)} ya no ${fraseEstado(obj.estado, [obj.quien])}`);
      case 'todos': {
        const ids = humanos(nivel), fem = ids.every(id => P(id).genero === 'f');
        if (ids.length === 1) return tituloDe({ tipo: 'estado', quien: ids[0], estado: obj.estado, valor: obj.valor }, nivel);
        const gn = { g: fem ? 'f' : 'm', n: 'pl' };
        if (obj.valor === false) return L.cap(`No ${fem ? 'todas' : 'todos'} ${fraseEstado(obj.estado, ids, 'pres', false, gn)}`);
        return L.cap(`${fem ? 'Todas' : 'Todos'} ${fraseEstado(obj.estado, ids, 'pres', false, gn)}`);
      }
      case 'nadie': return L.cap(`Nadie ${fraseEstado(obj.estado, [], 'pres', false, { g: 'm', n: 'sg' })}`);
      case 'nunca': return obj.quien ? L.cap(`${N1(obj.quien)} nunca ${fraseEstado(obj.estado, [obj.quien])}`) : L.cap(`Nadie ${fraseEstado(obj.estado, [], 'pres', false, { g: 'm', n: 'sg' }, 'nunca')}`);
      case 'evento': return (TITULO_EVENTO[obj.evento] || (() => obj.evento))(obj.quien, obj.a);
      case 'amigos': return `${N1(obj.a)} y ${N1(obj.b)} son amigos`;
      case 'enfadado': return `${N1(obj.quien)} está ${L.acuerdo('enfadado', L.gn(P(obj.quien)))} con ${N1(obj.con)}`;
      case 'y': return tituloY(obj.partes, nivel);
      default: return '';
    }
  }
  /* Título compuesto: fusiona lo que se puede para no repetir sujeto ni predicado.
     «Lucía ya no tiene hambre» + «Mateo ya no tiene hambre» → «Lucía y Mateo ya no tienen hambre»
     «Valeria está a salvo» + «Valeria nunca tiene miedo» → «Valeria está a salvo y nunca tiene miedo»
     «Todos están contentos» + «Todos están a salvo» → «Todos están contentos y a salvo» */
  function tituloY(partes, nivel) {
    const [a, b] = partes;
    if (partes.length === 2 && a && b) {
      const mismoPred = a.tipo === b.tipo && a.estado === b.estado && (a.valor !== false) === (b.valor !== false);
      if (mismoPred && (a.tipo === 'estado' || a.tipo === 'yaNo' || a.tipo === 'nunca') && a.quien && b.quien && a.quien !== b.quien) {
        const ids = ordenar([a.quien, b.quien]);
        const pre = a.tipo === 'yaNo' ? 'ya no ' : a.tipo === 'nunca' ? 'nunca ' : '';
        return L.cap(`${L.sujeto(Ps(ids))} ${pre}${fraseEstado(a.estado, ids, 'pres', a.tipo === 'estado' && a.valor === false)}`);
      }
      if (a.tipo === 'todos' && b.tipo === 'todos' && a.valor !== false && b.valor !== false && ESTADO_INFO[a.estado].tipo === ESTADO_INFO[b.estado].tipo) {
        const ids = humanos(nivel), fem = ids.every(id => P(id).genero === 'f'), gn = { g: fem ? 'f' : 'm', n: 'pl' };
        const verbo = L.conj(ESTADO_INFO[a.estado].tipo === 'tener' ? 'tener' : 'estar', gn, 'pres');
        return L.cap(`${fem ? 'Todas' : 'Todos'} ${verbo} ${complementoEstado(a.estado, gn)} y ${complementoEstado(b.estado, gn)}`);
      }
      const ta = tituloDe(a, nivel), tb = tituloDe(b, nivel);
      const suj = a.quien && b.quien && a.quien === b.quien ? N1(a.quien) + ' ' : null;
      if (suj && ta.startsWith(suj) && tb.startsWith(suj)) return `${ta} y ${tb.slice(suj.length)}`;
    }
    return partes.map((p, i) => { const t = tituloDe(p, nivel); return i && /^(Todos|Todas|Nadie|No todos|No todas) /.test(t) ? t[0].toLowerCase() + t.slice(1) : t; }).join(' y ');
  }

  /** Explica en español sencillo por qué el objetivo aún no se cumple. */
  function porque(obj, res, nivel) {
    if (!obj) return [];
    if (res.hist.invalido) return res.hist.eventos.filter(e => e.tipo === 'yaSalvo').map(e => `${N1(e.quien)} ya está a salvo: no puede seguir en la historia.`);
    if (res.incompleto) return ['Faltan viñetas: pon una escena y un personaje en cada viñeta.'];
    if (res.faltan && res.faltan.length) return res.faltan.map(id => `${N1(id)} no sale en la historia.`);

    switch (obj.tipo) {
      case 'estado': return [L.cap(`${N1(obj.quien)} ${fraseEstado(obj.estado, [obj.quien], 'pres', obj.valor !== false)}.`)];
      case 'yaNo': {
        if (valor(S[obj.quien], obj.estado)) return [L.cap(`${N1(obj.quien)} todavía ${fraseEstado(obj.estado, [obj.quien])}.`)];
        return [L.cap(`${N1(obj.quien)} nunca ${fraseEstado(obj.estado, [obj.quien])} en la historia.`)];
      }
      case 'todos': return humanos(nivel).filter(id => valor(S[id], obj.estado) !== (obj.valor !== false)).map(id => L.cap(`${N1(id)} ${fraseEstado(obj.estado, [id], 'pres', obj.valor !== false)}.`));
      case 'nadie': return humanos(nivel).filter(id => valor(S[id], obj.estado)).map(id => L.cap(`${N1(id)} ${fraseEstado(obj.estado, [id])}.`));
      case 'nunca': {
        const ids = obj.quien ? [obj.quien] : humanos(nivel);
        const out = [];
        for (const id of ids) {
          if (H.alguna[id] && H.alguna[id][obj.estado]) {
            const v = res.viñetas.findIndex(vi => vi.estado[id] && vi.estado[id][obj.estado]);
            out.push(L.cap(`${N1(id)} ${fraseEstado(obj.estado, [id])} en la viñeta ${v + 1}.`));
          }
        }
        return out;
      }
      case 'evento': return [`Falta: «${tituloDe(obj, nivel)}».`];
      case 'amigos': return [`${N1(obj.a)} y ${N1(obj.b)} no están juntos en ninguna viñeta.`];
      case 'enfadado': return [`${N1(obj.quien)} no está ${L.acuerdo('enfadado', L.gn(P(obj.quien)))} con ${N1(obj.con)}.`];
      case 'y': return obj.partes.flatMap(p => porque(p, res, nivel));
      default: return ['…'];
    }
  }

  /** «Lucía tiene hambre y frío. Está perdida.» — resumen de un personaje al final. */
  function describir(id, S, tiempo) {
    const s = S[id], t = tiempo || 'pres', gn = L.gn(P(id)), n = N1(id);
    if (s.salvo) return `${n} ${L.conj('estar', gn, t)} a salvo.`;
    const tener = ['hambre', 'sed', 'frio', 'miedo'].filter(k => s[k]).map(k => PALABRA[k]);
    const estar = ['cansado', 'herido', 'perdido'].filter(k => s[k]).map(k => L.acuerdo(k, gn));
    for (const x in s.enfadado) estar.push(`${L.acuerdo('enfadado', gn)} con ${N1(x)}`);
    const vt = L.conj('tener', gn, t), ve = L.conj('estar', gn, t);
    if (!tener.length && !estar.length) return `${n} ${ve} ${L.acuerdo('contento', gn)}.`;
    if (tener.length && estar.length) return `${n} ${vt} ${lista(tener)}. ${L.cap(ve)} ${lista(estar)}.`;
    if (tener.length) return `${n} ${vt} ${lista(tener)}.`;
    return `${n} ${ve} ${lista(estar)}.`;
  }
  function lista(xs) { return xs.length <= 1 ? xs.join('') : xs.slice(0, -1).join(', ') + ' y ' + xs[xs.length - 1]; }

  /* ---------- simular ---------- */
  function simular(nivel, viñetas, opts) {
    opts = opts || {};
    const tiempo = opts.tiempo === 'pret' ? 'pret' : 'pres';
    const ctx = { S: estadoInicial(nivel), hist: { alguna: {}, eventos: [], invalido: false, salen: {} }, tiempo };
    for (const id of nivel.personajes) ctx.hist.alguna[id] = {};
    const out = [];
    let incompleto = false;
    const n = nivel.viñetas;
    for (let i = 0; i < n; i++) {
      const panel = (viñetas && viñetas[i]) || {};
      const completa = !!(panel.escena && panel.personajes && panel.personajes.length);
      if (!completa) incompleto = true;
      const evs = ctx.hist.invalido || !completa ? [] : paso(ctx, panel, i);
      const partes = evs.map(e => frasesDe(e, tiempo));
      // El marco impersonal (Llueve mucho. / Hace mucho calor. / Es de noche.) va delante del encuentro.
      if (evs.length >= 2 && ['encuentra', 'seEncuentran'].includes(evs[0].tipo) && ['calor', 'tormenta', 'nocheJuntos'].includes(evs[1].tipo)) {
        const marco = partes[1][0];
        if (evs[1].tipo === 'nocheJuntos') { const m = marco.match(/^(\S+ de noche\.) (.*)$/); if (m) { partes[1][0] = m[2]; partes.unshift([m[1]]); } }
        else { partes[1] = partes[1].slice(1); partes.unshift([marco]); }
      }
      const frases = partes.flat();
      out.push({ escena: panel.escena || null, personajes: ordenar(panel.personajes || []), eventos: evs, frases, estado: clonar(ctx.S), completa });
    }
    const faltan = nivel.libre ? [] : humanos(nivel).filter(id => !ctx.hist.salen[id]);
    const res = { viñetas: out, estado: ctx.S, hist: ctx.hist, eventos: ctx.hist.eventos, incompleto, faltan, valido: !ctx.hist.invalido, tiempo };
    const completa = !incompleto && res.valido && !faltan.length;
    res.resuelto = completa && evaluar(nivel.objetivo, res, nivel);
    res.secreto = completa && !!nivel.secreto && evaluar(nivel.secreto, res, nivel);
    res.porque = nivel.objetivo ? porque(nivel.objetivo, res, nivel) : [];
    res.resumen = nivel.personajes.filter(id => out.some(v => v.personajes.includes(id))).map(id => describir(id, ctx.S, tiempo));
    res.frasesTodas = out.flatMap(v => v.frases);
    res.expresiones = {};
    for (const id of nivel.personajes) res.expresiones[id] = expresion(ctx.S[id]);
    return res;
  }

  /* ---------- resolver (todas las soluciones) ---------- */
  function opcionesDe(nivel) {
    const ids = ordenar(nivel.personajes), ops = [];
    for (const esc of nivel.escenas) {
      const slots = ESCENA[esc].slots;
      for (const a of ids) ops.push({ escena: esc, personajes: [a] });
      if (slots >= 2) for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) ops.push({ escena: esc, personajes: [ids[i], ids[j]] });
    }
    return ops;
  }
  /* Qué parte de la historia importa para los predicados del nivel (para compactar la memoización). */
  function relevantes(nivel) {
    const rel = { eventos: new Set(), alguna: new Set() };
    const visita = o => {
      if (!o) return;
      if (o.tipo === 'evento') rel.eventos.add(o.evento);
      if (o.tipo === 'yaNo' || o.tipo === 'nunca') rel.alguna.add(o.estado);
      if (o.tipo === 'y') o.partes.forEach(visita);
    };
    visita(nivel.objetivo); visita(nivel.secreto);
    return rel;
  }
  const OBJ_IDS = ['mapa', 'cuerda', 'manta', 'linterna', 'comida'];
  function clave(ctx, rel, ids) {
    let out = '';
    for (const id of ids) {
      const s = ctx.S[id];
      let b = 0;
      NEGATIVOS.forEach((k, i) => { if (s[k]) b |= 1 << i; });
      if (s.salvo) b |= 1 << 7;
      OBJ_IDS.forEach((o, i) => { if (s.objetos[o]) b |= 1 << (8 + i); });
      ids.forEach((o, i) => { if (s.amigos[o]) b |= 1 << (13 + i); if (s.enfadado[o]) b |= 1 << (18 + i); });
      NEGATIVOS.forEach((k, i) => { if (rel.alguna.has(k) && ctx.hist.alguna[id][k]) b |= 1 << (23 + i); });
      if (ctx.hist.salen[id]) b |= 1 << 30;
      out += b.toString(36) + '.';
    }
    if (rel.eventos.size) {
      const evs = new Set();
      for (const e of ctx.hist.eventos) if (rel.eventos.has(e.tipo)) evs.add(e.tipo + ':' + (e.quien || '') + ':' + (e.a || '') + ':' + (e.quienes || []).join('+'));
      out += [...evs].sort().join(',');

  }
  function resolver(nivel, opts) {
    opts = opts || {};

    const ops = opcionesDe(nivel), n = nivel.viñetas, rel = relevantes(nivel), ids = ordenar(nivel.personajes);
    const memo = new Map(); // clave → {t,s,a}
    let estados = 0, desbordado = false;
    function cuenta(ctx, i) {
      if (ctx.hist.invalido) return { t: 0, s: 0, a: 0 };
      if (i === n) {
        if (humanos(nivel).some(id => !ctx.hist.salen[id])) return { t: 0, s: 0, a: 0 };
        const res = { estado: ctx.S, hist: ctx.hist, incompleto: false, viñetas: [] };
        const ok = evaluar(nivel.objetivo, res, nivel), sec = !!nivel.secreto && evaluar(nivel.secreto, res, nivel);
        return { t: ok ? 1 : 0, s: sec ? 1 : 0, a: ok && sec ? 1 : 0 };
      }
      const k = i + '|' + clave(ctx, rel, ids);
      if (memo.has(k)) return memo.get(k);
      if (memo.size > limite) { desbordado = true; return { t: 0, s: 0, a: 0 }; }
      estados++;
      const r = { t: 0, s: 0, a: 0 };
      for (const op of ops) {
        const c = { S: clonar(ctx.S), hist: { alguna: clonarAlguna(ctx.hist.alguna), eventos: ctx.hist.eventos.slice(), invalido: false, salen: Object.assign({}, ctx.hist.salen) }, tiempo: 'pres' };
        paso(c, op, i);
        const x = cuenta(c, i + 1);
        r.t += x.t; r.s += x.s; r.a += x.a;
      }
      memo.set(k, r);
      return r;
    }
    function clonarAlguna(a) { const b = {}; for (const id in a) b[id] = Object.assign({}, a[id]); return b; }
    const inicio = { S: estadoInicial(nivel), hist: { alguna: {}, eventos: [], invalido: false, salen: {} }, tiempo: 'pres' };
    for (const id of nivel.personajes) inicio.hist.alguna[id] = {};
    const total = nivel.objetivo ? cuenta(inicio, 0) : { t: 0, s: 0, a: 0 };
    // enumerar soluciones (hasta max) siguiendo solo ramas con t>0
    const soluciones = [];
    function enumerar(ctx, i, camino) {
      if (soluciones.length >= max) return;
      if (i === n) { soluciones.push(camino.slice()); return; }
      for (const op of ops) {
        const c = { S: clonar(ctx.S), hist: { alguna: clonarAlguna(ctx.hist.alguna), eventos: ctx.hist.eventos.slice(), invalido: false, salen: Object.assign({}, ctx.hist.salen) }, tiempo: 'pres' };
        paso(c, op, i);
        if (c.hist.invalido) continue;
        const k = (i + 1) + '|' + clave(c, rel, ids);
        const r = i + 1 === n ? cuenta(c, i + 1) : memo.get(k);
        if (!r || !r.t) continue;
        camino.push(op); enumerar(c, i + 1, camino); camino.pop();
        if (soluciones.length >= max) return;
      }
    }
    if (nivel.objetivo && total.t) enumerar(inicio, 0, []);
    const posibles = Math.pow(ops.length, n);
    return { total: total.t, secretas: total.s, ambas: total.a, soluciones, estados, opciones: ops.length, posibles, densidad: total.t / posibles, desbordado };
  }

  /** Texto corto de una solución: «1 sol(Lucía) · 2 río(Lucía) · 3 río(Lucía)» */
  function textoSolucion(sol) {
    return sol.map((op, i) => `${i + 1} ${ESCENA[op.escena].nombre.replace(/^(El|La) /, '').toLowerCase()} (${op.personajes.map(N1).join(', ')})`).join(' · ');
  }

  return { simular, resolver, evaluar, tituloDe, porque, describir, lexicoDe, expresion, frasesDe, paso, estadoInicial, opcionesDe, textoSolucion, NEGATIVOS, LEXICO_ESCENA, P, ordenar };
});

  function personajeSVG(p, expresion, opts) {
    opts = opts || {};
    const ex = expresion || 'contento';
    const cuerpo = p.animal ? loro(p, ex) : humano(p, ex);

  }
  return { personajeSVG, retratoSVG };
});

<script>/* ui.js */
/* Sobrevives — interfaz (maqueta fase 0). Vanilla JS, sin dependencias.
   Arrastrar-soltar + repliegue clic-clic (clic en la carta, clic en la viñeta). Todo en localStorage. */
(function () {
  'use strict';
  const C = window.SVContenido, E = window.SVEngine, AP = window.SVArtePersonajes, AE = window.SVArteEscenas;
  const $ = s => document.querySelector(s);
  const el = (tag, attrs, html) => { const n = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'class') n.className = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]); } if (html !== undefined) n.innerHTML = html; return n; };
  const PJ = {}; for (const p of C.PERSONAJES) PJ[p.id] = p;
  const ES = {}; for (const e of C.ESCENAS) ES[e.id] = e;
  const KEY = 'sobrevives.progreso.v0';

  /* ---------- estado de la aplicación ---------- */
  let nivel = null, viñetas = [], res = null, seleccion = null, intentos = 0, pistaIdx = 0;
  let progreso = cargar();
  function cargar() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (_) { return {}; } }
  function guardar() { try { localStorage.setItem(KEY, JSON.stringify(progreso)); } catch (_) { /* sin almacenamiento */ } }

  /* ---------- voz ---------- */
  let voz = null;
  function elegirVoz() {
    if (!('speechSynthesis' in window)) return;
    const voces = speechSynthesis.getVoices();
    voz = voces.find(v => /^es[-_](ES|MX)/i.test(v.lang)) || voces.find(v => /^es/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }
  function hablar(texto) {
    if (!('speechSynthesis' in window) || !voz) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.voice = voz; u.lang = voz.lang; u.rate = 0.9;
    speechSynthesis.speak(u);
  }

  /* ---------- toast ---------- */
  let toastT = 0;
  function toast(msg, ms) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 2600);
  }

  /* ---------- niveles ---------- */
  function abrirNivel(id) {
    nivel = C.NIVELES.find(n => n.id === id) || C.NIVELES[0];
    viñetas = Array.from({ length: nivel.viñetas }, () => ({ escena: null, personajes: [] }));
    seleccion = null; intentos = 0; pistaIdx = 0;
    progreso.actual = nivel.id; guardar();
    pintarTodo();
    hablar(nivel.titulo);
  }
  function siguienteNivel() {
    const i = C.NIVELES.indexOf(nivel);
    const sig = C.NIVELES.slice(i + 1).find(n => !n.libre) || C.NIVELES.find(n => n.libre);
    abrirNivel(sig.id);
  }

  /* ---------- pintar ---------- */
  function pintarTodo() {
    $('#subcap').textContent = nivel.libre ? 'nivel libre' : `capítulo ${nivel.capitulo}`;
    const tt = $('#tituloTxt');
    tt.innerHTML = nivel.libre ? 'Mi historia <span class="alt">(sin título: inventa)</span>' : nivel.titulo;
    tt.classList.remove('ok');
    pintarStock();
    pintarTira();
    simular();
    pintarNiveles();
    pintarLexico();
  }
  function pintarStock() {
    const se = $('#stockEscenas'); se.innerHTML = '';
    for (const id of nivel.escenas) {
      const e = ES[id];
      const c = el('div', { class: 'carta escena', draggable: 'true', 'data-tipo': 'escena', 'data-id': id, title: e.nombre, role: 'button', tabindex: '0' });
      c.innerHTML = AE.escenaSVG(id) + `<span class="nom">${e.emoji} ${e.nombre}</span>`;
      arrastrable(c, 'escena', id);
      se.appendChild(c);
    }
    const sp = $('#stockPersonajes'); sp.innerHTML = '';
    for (const id of nivel.personajes) {
      const p = PJ[id];
      const c = el('div', { class: 'carta ficha ' + id, draggable: 'true', 'data-tipo': 'personaje', 'data-id': id, title: p.rasgo, role: 'button', tabindex: '0' });
      c.innerHTML = AP.retratoSVG(p) + `<span class="nom">${p.nombre}</span>`;
      arrastrable(c, 'personaje', id);
      sp.appendChild(c);
    }
  }
  function arrastrable(c, tipo, id) {
    c.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', tipo + ':' + id); ev.dataTransfer.effectAllowed = 'copy'; seleccionar(null); });
    const clic = () => seleccionar(seleccion && seleccion.id === id && seleccion.tipo === tipo ? null : { tipo, id });
    c.addEventListener('click', clic);
    c.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); clic(); } });
  }
  function seleccionar(s) {
    seleccion = s;
    document.querySelectorAll('.carta').forEach(c => c.classList.toggle('sel', !!s && c.dataset.tipo === s.tipo && c.dataset.id === s.id));
    if (s) toast(s.tipo === 'escena' ? `Ahora haz clic en una viñeta para poner «${ES[s.id].nombre}»` : `Ahora haz clic en una viñeta para poner a ${PJ[s.id].nombre}`, 3500);
  }
  function pintarTira() {
    const tira = $('#tira'); tira.innerHTML = '';
    const n = nivel.viñetas;
    tira.style.setProperty('--ancho-vineta', n <= 3 ? '400px' : n === 4 ? '360px' : '330px');
    viñetas.forEach((v, i) => {
      const caja = el('div', { class: 'vineta', 'data-i': i });
      const esc = el('div', { class: 'escena-caja' + (v.escena ? '' : ' vacia'), 'data-i': i, role: 'button', tabindex: '0', 'aria-label': `Viñeta ${i + 1}${v.escena ? ': ' + ES[v.escena].nombre : ' (vacía)'}` });
      esc.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && seleccion) { ev.preventDefault(); colocar(i, seleccion.tipo, seleccion.id); seleccionar(null); } });
      esc.appendChild(el('span', { class: 'num' }, String(i + 1)));
      if (v.escena) {
        esc.insertAdjacentHTML('beforeend', AE.escenaSVG(v.escena, { clase: 'fondo' }));
        const pjs = el('div', { class: 'personajes' + (v.personajes.length ? '' : ' vacia') });
        esc.appendChild(pjs);
        esc.appendChild(el('button', { class: 'quitar', title: 'Quitar la escena', onclick: ev => { ev.stopPropagation(); viñetas[i] = { escena: null, personajes: [] }; pintarTira(); simular(); } }, '×'));
      }
      // soltar
      esc.addEventListener('dragover', ev => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; esc.classList.add('sobre'); });
      esc.addEventListener('dragleave', () => esc.classList.remove('sobre'));
      esc.addEventListener('drop', ev => { ev.preventDefault(); esc.classList.remove('sobre'); const [tipo, id] = (ev.dataTransfer.getData('text/plain') || '').split(':'); if (tipo) colocar(i, tipo, id); });
      esc.addEventListener('click', () => { if (seleccion) { colocar(i, seleccion.tipo, seleccion.id); seleccionar(null); } });
      caja.appendChild(esc);
      const frase = el('p', { class: 'frase vacia', title: 'Escuchar' }, '…');
      frase.addEventListener('click', () => { if (frase.textContent && !frase.classList.contains('vacia')) hablar(frase.textContent); });
      caja.appendChild(frase);
      tira.appendChild(caja);
    });
  }
  function colocar(i, tipo, id) {
    const v = viñetas[i];
    if (tipo === 'escena') {
      v.escena = id;
      const slots = ES[id].slots;
      if (v.personajes.length > slots) v.personajes = v.personajes.slice(0, slots);
    } else {
      if (!v.escena) { toast('Primero pon una escena en la viñeta.'); return; }
      if (v.personajes.includes(id)) { toast(`${PJ[id].nombre} ya está en esta viñeta.`); return; }
      const slots = ES[v.escena].slots;
      if (v.personajes.length >= slots) { if (slots === 1) v.personajes = [id]; else v.personajes[slots - 1] = id; }
      else v.personajes.push(id);
    }
    pintarTira(); simular();
  }
  function quitarPersonaje(i, id) { viñetas[i].personajes = viñetas[i].personajes.filter(x => x !== id); pintarTira(); simular(); }

  function simular() {
    res = E.simular(nivel, viñetas, { tiempo: progreso.preterito ? 'pret' : 'pres' });
    // personajes y frases
    document.querySelectorAll('.vineta').forEach((caja, i) => {
      const v = viñetas[i], r = res.viñetas[i];
      const pjs = caja.querySelector('.personajes');
      if (pjs) {
        pjs.innerHTML = '';
        for (const id of r.personajes) {
          const ex = r.estado[id] ? E.expresion(r.estado[id]) : 'contento';
          const w = el('div', { class: 'pj-wrap', title: `${PJ[id].nombre} — clic para quitar` });
          w.innerHTML = AP.personajeSVG(PJ[id], ex, { clase: 'pj' });
          w.style.height = '100%'; w.style.display = 'flex'; w.style.alignItems = 'flex-end';
          w.addEventListener('click', ev => { ev.stopPropagation(); quitarPersonaje(i, id); });
          pjs.appendChild(w);
        }
      }
      const f = caja.querySelector('.frase');
      if (!v.escena) { f.textContent = '…'; f.className = 'frase vacia'; }
      else if (!v.personajes.length) { f.textContent = `${ES[v.escena].nombre}. ¿Quién está aquí?`; f.className = 'frase vacia'; }
      else if (r.frases.length) { f.textContent = r.frases.join(' '); f.className = 'frase' + (r.eventos.some(e => e.tipo === 'yaSalvo') ? ' alerta' : ''); }
      else { f.textContent = '…'; f.className = 'frase vacia'; }
    });
    // estado del nivel
    const est = $('#estadoNivel'), tt = $('#tituloTxt');
    if (nivel.libre) { est.textContent = res.incompleto ? `${viñetas.filter(v => v.escena && v.personajes.length).length}/${nivel.viñetas} viñetas` : '¡Historia completa!'; est.className = res.incompleto ? '' : 'ok'; return; }
    tt.classList.toggle('ok', res.resuelto);
    if (res.resuelto) { est.textContent = '✔ ¡Muy bien!' + (res.secreto ? ' 🔑 ¡Título secreto!' : ''); est.className = 'ok'; exito(); }
    else if (res.incompleto || res.faltan.length) { est.textContent = ''; est.className = ''; }
    else { est.textContent = 'Todavía no…'; est.className = ''; fallo(); }
  }
  let ultimoFallo = '';
  function fallo() {
    const firma = JSON.stringify(viñetas);
    if (firma === ultimoFallo) return;
    ultimoFallo = firma; intentos++;
    if (intentos === 2 && nivel.pistas && nivel.pistas.length) toast('💡 ' + nivel.pistas[0], 5000);
  }
  let exitoMostrado = '';
  function exito() {
    const firma = nivel.id + '|' + JSON.stringify(viñetas);
    if (firma === exitoMostrado) return;
    exitoMostrado = firma;
    const p = progreso[nivel.id] || {};
    p.estrellas = Math.max(p.estrellas || 0, intentos <= 1 ? 3 : intentos <= 3 ? 2 : 1);
    if (res.secreto) p.secreto = true;
    progreso[nivel.id] = p; guardar();
    pintarNiveles();
    const d = $('#dlgExito');
    d.innerHTML = `<h2>¡Muy bien!</h2><div class="grande">${'★'.repeat(p.estrellas)}${'☆'.repeat(3 - p.estrellas)}</div>
      <p><b>${nivel.titulo}</b></p>${res.secreto ? `<p>🔑 Título secreto: <b>${E.tituloDe(nivel.secreto, nivel)}</b></p>` : (nivel.secreto ? '<p class="alt">Hay un título secreto en este nivel… ¿lo encuentras?</p>' : '')}
      <div class="fila"><button class="btn sec" id="btnSeguir">Seguir aquí</button><button class="btn" id="btnLeer">Leer la historia</button><button class="btn verde" id="btnSig">Siguiente nivel →</button></div>`;
    d.querySelector('#btnSeguir').onclick = () => d.close();
    d.querySelector('#btnLeer').onclick = () => { d.close(); quePasa(); };
    d.querySelector('#btnSig').onclick = () => { d.close(); siguienteNivel(); };
    setTimeout(() => d.showModal(), 350);
    hablar(res.frasesTodas.join(' '));
  }

  /* ---------- ¿Qué pasa? ---------- */
  function quePasa() {
    const d = $('#dlgQuePasa');
    const partes = res.viñetas.map((v, i) => `<p data-f="${i}"><b>${i + 1}.</b> ${v.frases.length ? v.frases.join(' ') : '<i>…</i>'}</p>`).join('');
    const resumen = res.resumen.length ? `<h3>Al final</h3>${res.resumen.map(s => `<p class="res">${s}</p>`).join('')}` : '';
    let juicio = '';
    if (!nivel.libre) {
      if (res.resuelto) juicio = `<div class="porque ok">✔ La historia cumple el título: «${nivel.titulo}».</div>`;
      else if (res.porque.length) juicio = `<div class="porque">${res.porque.map(p => `<div>✗ ${p}</div>`).join('')}</div>`;
    }
    d.innerHTML = `<h2>¿Qué pasa?</h2><div class="historia">${partes}${resumen}</div>${juicio}
      <div class="fila"><button class="btn sec" id="btnOir">🔊 Escuchar todo</button><button class="btn" id="btnCerrar">Cerrar</button></div>`;
    d.querySelectorAll('.historia p').forEach(p => p.addEventListener('click', () => hablar(p.textContent.replace(/^\d+\.\s*/, ''))));
    d.querySelector('#btnOir').onclick = () => hablar(res.frasesTodas.concat(res.resumen).join(' '));
    d.querySelector('#btnCerrar').onclick = () => d.close();
    d.showModal();
  }

  /* ---------- paneles ---------- */
  function pintarNiveles() {
    const p = $('#panelNiveles');
    const caps = { 1: 'Capítulo 1 · Solo en la selva', 2: 'Capítulo 2 · Juntos', 3: 'Capítulo 3 · El grupo', 0: 'Nivel libre' };
    let html = `<h2>Niveles <button class="btn sec" id="cerrarNiv">×</button></h2>`;
    for (const c of [1, 2, 3, 0]) {
      html += `<h3>${caps[c]}</h3>`;
      for (const n of C.NIVELES.filter(n => n.capitulo === c)) {
        const pr = progreso[n.id] || {};
        const est = n.libre ? '' : `<span class="estrellas">${'★'.repeat(pr.estrellas || 0)}${'☆'.repeat(3 - (pr.estrellas || 0))}${pr.secreto ? ' 🔑' : ''}</span>`;
        html += `<button class="niv${n === nivel ? ' actual' : ''}${pr.estrellas ? ' hecho' : ''}" data-id="${n.id}"><span>${n.libre ? '✎' : n.viñetas + ' ▭'}</span><span>${n.titulo}</span>${est}</button>`;
      }
    }
    html += `<h3>Datos</h3><button class="btn sec" id="btnBorrarDatos">Borrar mis datos</button><p style="font-size:.9rem;color:var(--tinta2)">Las estrellas se guardan solo en este navegador.</p>`;
    p.innerHTML = html;
    p.querySelector('#cerrarNiv').onclick = () => { p.hidden = true; };
    p.querySelectorAll('.niv').forEach(b => b.onclick = () => { p.hidden = true; abrirNivel(b.dataset.id); });
    p.querySelector('#btnBorrarDatos').onclick = () => { if (confirm('¿Borrar las estrellas y el progreso de este navegador?')) { progreso = {}; guardar(); pintarNiveles(); toast('Datos borrados.'); } };
  }
  function pintarLexico() {
    const p = $('#panelLexico');
    const lex = E.lexicoDe(nivel);
    p.innerHTML = `<h2>Léxico <button class="btn sec" id="cerrarLex">×</button></h2><p style="color:var(--tinta2);font-size:.95rem">Palabras de este nivel. Haz clic para escuchar.</p><div class="lex">${lex.map(w => `<button data-w="${w.palabra}"><span>${w.picto}</span><span>${w.palabra}</span></button>`).join('')}</div>`;
    p.querySelector('#cerrarLex').onclick = () => { p.hidden = true; };
    p.querySelectorAll('.lex button').forEach(b => b.onclick = () => hablar(b.dataset.w));
  }

  /* ---------- botones ---------- */
  $('#btnNiveles').onclick = () => { const p = $('#panelNiveles'); p.hidden = !p.hidden; $('#panelLexico').hidden = true; };
  $('#btnLexico').onclick = () => { const p = $('#panelLexico'); p.hidden = !p.hidden; $('#panelNiveles').hidden = true; };
  $('#btnQuePasa').onclick = quePasa;
  $('#btnReiniciar').onclick = () => { viñetas = viñetas.map(() => ({ escena: null, personajes: [] })); pintarTira(); simular(); };
  $('#btnPista').onclick = () => {
    if (nivel.libre || !nivel.pistas || !nivel.pistas.length) { toast('Aquí no hay pistas: ¡inventa tu historia!'); return; }
    toast('💡 ' + nivel.pistas[pistaIdx % nivel.pistas.length], 5000); pistaIdx++;
  };
  $('#tituloTxt').onclick = () => hablar(nivel.libre ? 'Mi historia' : nivel.titulo);
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { seleccionar(null); $('#panelNiveles').hidden = true; $('#panelLexico').hidden = true; }
  });

  /* ---------- inicio ---------- */
  abrirNivel(progreso.actual || C.NIVELES[0].id);
})();

</script>
</body>
</html>
