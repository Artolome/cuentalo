    function ponerACero() { parar(); acumulado = 0; tiempo.classList.remove('svp-fin'); pintarTiempo(); }
    function tick() {
      pintarTiempo();
      if (transcurrido() < duracion()) return;
      parar(); acumulado = duracion(); pintarTiempo();
      if (datos.crono !== 'arriba') { tiempo.classList.add('svp-fin'); pitido(); toast('¡Tiempo!'); }
    }
    function empezar() {
      if (transcurrido() >= duracion()) acumulado = 0; // ya había terminado: vuelve a empezar
      tiempo.classList.remove('svp-fin');
      prepararAudio();
      inicioMs = Date.now(); corriendo = true;
      temporizadores.crono = setInterval(tick, 200);
      pintarPlay(); pintarTiempo();
    }
    btnPlay.addEventListener('click', () => (corriendo ? parar() : empezar()));
    btnCero.addEventListener('click', ponerACero);
    const filaCrono = el('div', { class: 'svp-fila' });
    filaCrono.appendChild(btnPlay); filaCrono.appendChild(btnCero);
    wCrono.appendChild(tiempo); wCrono.appendChild(filaCrono); wCrono.appendChild(modos);
    pintarModos(); pintarPlay(); pintarTiempo();

    /* ===== 2. Sorteo (solo números, nunca nombres) ===== */
    const wSorteo = el('section', { class: 'svp-widget svp-sorteo' });
    wSorteo.appendChild(el('h3', { class: 'svp-titulo' }, 'Sorteo'));
    const bola = el('div', { class: 'svp-num svp-bola', 'aria-live': 'polite', 'aria-label': 'Número que ha salido' }, '?');
    const campo = el('input', { class: 'svp-campo', type: 'number', min: String(MIN_ALUMNOS), max: String(MAX_ALUMNOS), step: '1', inputmode: 'numeric', 'aria-label': 'Número de alumnos' });
    campo.value = String(datos.alumnos);
    const etiqueta = el('label', { class: 'svp-etiqueta' }); etiqueta.appendChild(document.createTextNode('Alumnos:')); etiqueta.appendChild(campo);
    const btnNumero = el('button', { class: 'svp-btn svp-grande svp-rojo', type: 'button' }, '¡Número!');
    const casilla = el('input', { class: 'svp-casilla', type: 'checkbox' });
    casilla.checked = datos.sinRepetir;
    const etqCasilla = el('label', { class: 'svp-etiqueta' }); etqCasilla.appendChild(casilla); etqCasilla.appendChild(document.createTextNode('sin repetir'));
    const nota = el('span', { class: 'svp-nota', 'aria-live': 'polite' });
    const btnBolsa = el('button', { class: 'svp-btn', type: 'button', 'aria-label': 'Todos los números otra vez', title: 'Todos los números otra vez' }, '↺');
    let bolsa = [], ultimo = 0, animando = false;

    function llenarBolsa() { bolsa = Array.from({ length: datos.alumnos }, (_, i) => i + 1); }
    function pintarBolsa() {
      nota.hidden = !datos.sinRepetir; btnBolsa.hidden = !datos.sinRepetir;
      nota.textContent = bolsa.length === 1 ? 'Queda 1' : 'Quedan ' + bolsa.length;
    }
    function fijarAlumnos() {
      const v = limitar(parseInt(campo.value, 10) || datos.alumnos, MIN_ALUMNOS, MAX_ALUMNOS);
      campo.value = String(v);
      if (v !== datos.alumnos) { datos.alumnos = v; guardar(); llenarBolsa(); pintarBolsa(); }
    }
    function sortear() {
      if (animando) return;
      fijarAlumnos();
      const n = datos.alumnos;
      let final;
      if (datos.sinRepetir) {
        if (!bolsa.length) { llenarBolsa(); toast('Ya han salido todos los números. ¡Empezamos otra vez!'); }
        final = bolsa.splice(Math.floor(Math.random() * bolsa.length), 1)[0];
      } else {
        do { final = 1 + Math.floor(Math.random() * n); } while (final === ultimo); // sin repetir el anterior dos veces seguidas
      }
      ultimo = final; animando = true; btnNumero.disabled = true;
      bola.classList.add('svp-girando'); bola.classList.remove('svp-pop');
      const t0 = Date.now();
      const paso = () => {
        if (Date.now() - t0 < 800) {
          bola.textContent = String(1 + Math.floor(Math.random() * n));
          temporizadores.anim = setTimeout(paso, 60);
          return;
        }
        temporizadores.anim = 0;
        bola.textContent = String(final);
        bola.classList.remove('svp-girando'); pop(bola);
        animando = false; btnNumero.disabled = false;
        pintarBolsa();
        if (hablar) hablar('Número ' + numeroEnLetras(final));
      };
      paso();
    }
    campo.addEventListener('change', fijarAlumnos);
    campo.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); fijarAlumnos(); sortear(); } });
    casilla.addEventListener('change', () => { datos.sinRepetir = casilla.checked; guardar(); llenarBolsa(); pintarBolsa(); });
    btnNumero.addEventListener('click', sortear);
    btnBolsa.addEventListener('click', () => { llenarBolsa(); pintarBolsa(); toast('Todos los números otra vez.'); });
    const fila1 = el('div', { class: 'svp-fila' }); fila1.appendChild(etiqueta); fila1.appendChild(btnNumero);
    const fila2 = el('div', { class: 'svp-fila' }); fila2.appendChild(etqCasilla); fila2.appendChild(nota); fila2.appendChild(btnBolsa);
    wSorteo.appendChild(bola); wSorteo.appendChild(fila1); wSorteo.appendChild(fila2);
    llenarBolsa(); pintarBolsa();

    /* ===== 3. Equipos ===== */
    const wEquipos = el('section', { class: 'svp-widget svp-equipos' });
    wEquipos.appendChild(el('h3', { class: 'svp-titulo' }, 'Equipos'));
    const selector = el('div', { class: 'svp-fila', role: 'group', 'aria-label': 'Número de equipos' });
    const chipsEq = [2, 3, 4].map(n => {
      const c = el('button', { class: 'svp-chip', type: 'button', 'data-n': String(n), 'aria-pressed': 'false', 'aria-label': n + ' equipos' }, n + ' equipos');
      c.addEventListener('click', () => { datos.equipos = n; guardar(); pintarEquipos(); });
      selector.appendChild(c);
      return c;
    });
    const btnCeroEq = el('button', { class: 'svp-btn', type: 'button', 'aria-label': 'Poner los puntos a cero', title: 'Poner los puntos a cero' }, '↺');
    btnCeroEq.addEventListener('click', () => {
      if (W && W.confirm('¿Poner todos los puntos a cero?')) { datos.puntos = [0, 0, 0, 0]; guardar(); pintarEquipos(); toast('Marcador a cero.'); }
    });
    selector.appendChild(btnCeroEq);
    const tarjetas = el('div', { class: 'svp-tarjetas' });
    const fichas = COLORES.map((col, i) => {
      const t = el('div', { class: 'svp-tarjeta' });
      t.style.setProperty('--c', col.fondo); t.style.setProperty('--t', col.texto);
      const nombre = el('button', { class: 'svp-nombre', type: 'button', title: 'Cambiar el nombre del equipo' });
      /* Nombre libre con prompt(); se propone el nombre actual, nunca nombres de alumnos. */
      nombre.addEventListener('click', () => {
        if (!W) return;
        const nuevo = W.prompt('Nombre del equipo ' + (i + 1) + ':', datos.nombres[i]);
        if (nuevo === null) return;
        datos.nombres[i] = (nuevo.trim() || 'Equipo ' + (i + 1)).slice(0, 24);
        guardar(); pintarEquipos();
      });
      const puntos = el('div', { class: 'svp-num svp-puntos', 'aria-live': 'polite' }, '0');
      const sumar = d => { const v = limitar(datos.puntos[i] + d, 0, MAX_PUNTOS); if (v === datos.puntos[i]) return; datos.puntos[i] = v; guardar(); puntos.textContent = String(v); pop(puntos); };
      const menos = el('button', { class: 'svp-btn', type: 'button', 'aria-label': 'Quitar un punto a ' + datos.nombres[i] }, '−1');
      const mas = el('button', { class: 'svp-btn', type: 'button', 'aria-label': 'Dar un punto a ' + datos.nombres[i] }, '+1');
      menos.addEventListener('click', () => sumar(-1));
      mas.addEventListener('click', () => sumar(1));
      const fila = el('div', { class: 'svp-fila' }); fila.appendChild(menos); fila.appendChild(mas);
      t.appendChild(nombre); t.appendChild(puntos); t.appendChild(fila);
      tarjetas.appendChild(t);
      return { t, nombre, puntos, menos, mas };
    });
    function pintarEquipos() {
      chipsEq.forEach(c => c.setAttribute('aria-pressed', String(+c.dataset.n === datos.equipos)));
      fichas.forEach((f, i) => {
        f.t.hidden = i >= datos.equipos;
        f.nombre.textContent = datos.nombres[i];
        f.puntos.textContent = String(datos.puntos[i]);
        f.menos.setAttribute('aria-label', 'Quitar un punto a ' + datos.nombres[i]);
        f.mas.setAttribute('aria-label', 'Dar un punto a ' + datos.nombres[i]);
      });
    }
    wEquipos.appendChild(selector); wEquipos.appendChild(tarjetas);
    pintarEquipos();

    barra.appendChild(wCrono); barra.appendChild(wSorteo); barra.appendChild(wEquipos);
    contenedor.appendChild(barra);

    /* ===== API ===== */
    function reiniciar() {
      ponerACero();
      clearTimeout(temporizadores.anim); temporizadores.anim = 0; animando = false; btnNumero.disabled = false;
      bola.textContent = '?'; bola.classList.remove('svp-girando', 'svp-pop'); ultimo = 0; llenarBolsa(); pintarBolsa();
      datos.puntos = [0, 0, 0, 0]; guardar(); pintarEquipos();
    }
    function destruir() {
      parar();
      clearTimeout(temporizadores.anim); temporizadores.anim = 0;
      try { if (audio && audio.close) audio.close(); } catch (_) { /* nada */ }
      audio = null;
      if (barra.parentNode) barra.parentNode.removeChild(barra);
    }
    return { destruir, reiniciar };
  }

  return { montar, CSS, numeroEnLetras, KEY };
});

</script>
<script>/* ui.js */
/* Cuéntalo — interfaz principal. Vanilla JS, sin dependencias.
   Arrastrar-soltar + repliegue clic-clic (clic en la carta, clic en la viñeta). Todo en localStorage.
   Expone window.SVApp (ganchos para los módulos Autor / Profe / Escritor / Imprimir, en src/ui-modos.js). */
(function () {
  'use strict';
  const C = window.SVContenido, E = window.SVEngine, AP = window.SVArtePersonajes, AE = window.SVArteEscenas;
  const $ = s => document.querySelector(s);
  const el = (tag, attrs, html) => { const n = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'class') n.className = attrs[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]); } if (html !== undefined) n.innerHTML = html; return n; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); // los títulos de autor son texto libre
  const PJ = {}; for (const p of C.PERSONAJES) PJ[p.id] = p;
  const ES = {}; for (const e of C.ESCENAS) ES[e.id] = e;
  const KEY = 'cuentalo.progreso.v0';
  const DIF = { 1: 'Paso a paso', 2: 'Estándar', 3: 'Reto' };

  /* ---------- estado de la aplicación ---------- */
  let nivel = null, viñetas = [], res = null, seleccion = null, intentos = 0, pistaIdx = 0;
  let progreso = cargar();
  let extra = []; // niveles de autor (los añade ui-modos.js)
  let pizarraApi = null; // barra de clase montada (cronómetro, sorteo, equipos)
  function cargar() { try { const p = JSON.parse(localStorage.getItem(KEY) || '{}'); return p && typeof p === 'object' && !Array.isArray(p) ? p : {}; } catch (_) { return {}; } }
  function guardar() { try { localStorage.setItem(KEY, JSON.stringify(progreso)); } catch (_) { /* sin almacenamiento */ } }
  function ajustes() { if (!progreso.ajustes || typeof progreso.ajustes !== 'object') progreso.ajustes = { modo: null, dif: 2, escritor: false, preterito: false }; return progreso.ajustes; }
  const dif = () => [1, 2, 3].includes(ajustes().dif) ? ajustes().dif : 2;
  const progresoDe = id => (progreso[id] && typeof progreso[id] === 'object') ? progreso[id] : {};
  const tiempo = () => ajustes().preterito ? 'pret' : 'pres';
  const todosNiveles = () => C.NIVELES.concat(extra);

  /* ---------- voz ---------- */
  let voz = null;
  function elegirVoz() {
    if (!('speechSynthesis' in window)) return;
    const voces = speechSynthesis.getVoices();
    voz = voces.find(v => /^es[-_](ES|MX)/i.test(v.lang)) || voces.find(v => /^es/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }
  function hablar(texto) {
    if (!('speechSynthesis' in window) || !voz || !texto) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.voice = voz; u.lang = voz.lang; u.rate = 0.9;
    speechSynthesis.speak(u);
  }

  /* ---------- toast ---------- */
  let toastT = 0;
  function toast(msg, ms) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 2600);
  }

  /* ---------- pantalla de inicio y modos ---------- */
  function pintarInicio() {
    const p = $('#inicioApp');
    p.hidden = false;
    p.querySelector('#cardAutor').hidden = !(window.SVApp && window.SVApp.abrirAutor);
    cerrarPaneles();
  }
  function elegirModo(m) {
    ajustes().modo = m; guardar();
    document.body.classList.toggle('pizarra', m === 'pizarra');
    document.documentElement.classList.toggle('pizarra', m === 'pizarra'); // el tamaño de letra (rem) se define en <html>
    $('#inicioApp').hidden = true;
    const clase = $('#clase');
    if (m === 'pizarra' && window.SVPizarra && !clase.dataset.montado) { try { pizarraApi = window.SVPizarra.montar(clase, { hablar, toast }); clase.dataset.montado = '1'; } catch (e) { console.error(e); } }
    clase.hidden = !(m === 'pizarra' && clase.dataset.montado && ajustes().clase === true); // oculta por defecto: se abre con «⏱ Clase»
    $('#btnClase').hidden = !(m === 'pizarra' && clase.dataset.montado);
    ajustarTira();
    const vis = nivelesVisibles();
    const actual = vis.find(n => n.id === progreso.actual);
    abrirNivel(actual ? actual.id : vis[0].id);
  }

  /* ---------- dificultad (★ / ★★ / ★★★) ---------- */
  function nivelesVisibles() {
    const d = dif(), todos = todosNiveles().filter(n => !n.enConstruccion);
    if (d === 1) return todos.filter(n => n.libre || n.autor || (n.viñetas <= 3 && n.escenas.length <= 3));
    if (d === 3) return todos.filter(n => n.libre || n.autor || n.viñetas >= 4);
    return todos;
  }
  const esActual = n => !!nivel && n.id === nivel.id;
  function pintarDif() {
    const d = dif();
    $('#btnDif').textContent = '★'.repeat(d);
    $('#btnDif').title = 'Modo de juego: ' + DIF[d];
    document.querySelectorAll('#menuDif button').forEach(b => b.classList.toggle('actual', +b.dataset.d === d));
    document.body.classList.toggle('paso', d === 1);
    document.body.classList.toggle('reto', d === 3);
  }
  function ponerDif(d) {
    ajustes().dif = d; guardar(); pintarDif();
    $('#menuDif').hidden = true;
    const vis = nivelesVisibles();
    if (nivel && !nivel.enConstruccion && !vis.some(esActual)) abrirNivel(vis[0].id); else pintarTodo();
  }

  /* ---------- niveles ---------- */
  function abrirNivel(id) {
    nivel = todosNiveles().find(n => n.id === id) || C.NIVELES[0];
    viñetas = Array.from({ length: nivel.viñetas }, () => ({ escena: null, personajes: [] }));
    seleccion = null; intentos = 0; pistaIdx = 0; ultimoFallo = ''; exitoMostrado = ''; avisoEscritor = '';
    if (window.SVApp.escritor) window.SVApp.escritor.reiniciar();
    progreso.actual = nivel.id; guardar();
    pintarTodo();
    hablar(nivel.libre ? 'Mi historia' : nivel.titulo);
  }
  function siguienteNivel() {
    const vis = nivelesVisibles(), i = vis.findIndex(esActual);
    const sig = vis.slice(i + 1).find(n => !n.libre) || vis.find(n => n.libre) || vis[0];
    abrirNivel(sig.id);
  }
  function tituloSecreto(n) { return n.tituloSecreto || E.tituloDe(n.secreto, n); }

  /* ---------- pintar ---------- */
  function pintarTodo() {
    pintarDif();
    $('#subcap').textContent = nivel.libre ? 'nivel libre' : nivel.autor ? 'nivel de autor' : `capítulo ${nivel.capitulo}`;
    const tt = $('#tituloTxt');
    tt.innerHTML = nivel.libre ? 'Mi historia <span class="alt">(sin título: ¡inventa uno!)</span>' : esc(nivel.titulo);
    tt.classList.remove('ok');
    // línea «Al principio» + título secreto
    const ini = $('#inicio');
    const lineas = E.simular(nivel, [], { tiempo: tiempo() }).inicio;
    let sec = '';
    if (nivel.secreto) {
      const pr = progresoDe(nivel.id);
      sec = (pr.secreto || (dif() !== 3 && pr.estrellas)) ? `🔑 Título secreto: <b>${esc(tituloSecreto(nivel))}</b>` : '🔑 Hay un título secreto.';
    }
    ini.hidden = !lineas.length && !sec;
    ini.innerHTML = (lineas.length ? `<span><b>Al principio:</b> ${lineas.join(' ')}</span>` : '') + (sec ? `<span class="sec">${sec}</span>` : '');
    pintarStock();
    pintarTira();
    simular();
    pintarNiveles();
    pintarLexico();
    if (window.SVApp.alPintar) window.SVApp.alPintar();
  }
  function pintarStock() {
    const se = $('#stockEscenas'); se.innerHTML = '';
    for (const id of nivel.escenas) {
      const e = ES[id];
      const c = el('div', { class: 'carta escena', draggable: 'true', 'data-tipo': 'escena', 'data-id': id, title: e.nombre, role: 'button', tabindex: '0' });
      c.innerHTML = AE.escenaSVG(id) + `<span class="nom"><span class="pic">${e.emoji}</span> ${e.nombre}</span>`;
      arrastrable(c, 'escena', id);
      se.appendChild(c);
    }
    const sp = $('#stockPersonajes'); sp.innerHTML = '';
    for (const id of nivel.personajes) {
      const p = PJ[id];
      const c = el('div', { class: 'carta ficha ' + id, draggable: 'true', 'data-tipo': 'personaje', 'data-id': id, title: p.rasgo, role: 'button', tabindex: '0' });
      c.innerHTML = AP.retratoSVG(p) + `<span class="nom">${p.nombre}</span>`;
      arrastrable(c, 'personaje', id);
      sp.appendChild(c);
    }
    $('#stock').style.setProperty('--n-cartas', nivel.escenas.length + nivel.personajes.length);
  }
  function arrastrable(c, tipo, id) {
    c.addEventListener('dragstart', ev => { ev.dataTransfer.setData('text/plain', tipo + ':' + id); ev.dataTransfer.effectAllowed = 'copy'; seleccionar(null); });
    const clic = () => seleccionar(seleccion && seleccion.id === id && seleccion.tipo === tipo ? null : { tipo, id });
    c.addEventListener('click', clic);
    c.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); clic(); } });
  }
  function seleccionar(s) {
    seleccion = s;
    document.querySelectorAll('.carta').forEach(c => c.classList.toggle('sel', !!s && c.dataset.tipo === s.tipo && c.dataset.id === s.id));
    document.body.classList.toggle('seleccion', !!s);
    if (s) toast(s.tipo === 'escena' ? `Ahora haz clic en una viñeta para poner «${ES[s.id].nombre}»` : `Ahora haz clic en una viñeta para poner a ${PJ[s.id].nombre}`, 3500);
  }
  function pintarTira() {
    const tira = $('#tira'); tira.innerHTML = '';
    const n = nivel.viñetas;
    // Una sola fila (como una tira de cómic): se lee de izquierda a derecha y cabe en 16:9 sin desplazamiento.
    tira.style.setProperty('--cols', n);
    tira.style.setProperty('--fz', n <= 3 ? 1 : n === 4 ? 0.92 : 0.84);
    viñetas.forEach((v, i) => {
      const caja = el('div', { class: 'vineta', 'data-i': i });
      const esc = el('div', { class: 'escena-caja' + (v.escena ? '' : ' vacia'), 'data-i': i, role: 'button', tabindex: '0', 'aria-label': `Viñeta ${i + 1}${v.escena ? ': ' + ES[v.escena].nombre : ' (vacía)'}` });
      esc.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && seleccion) { ev.preventDefault(); if (colocar(i, seleccion.tipo, seleccion.id)) seleccionar(null); } });
      esc.appendChild(el('span', { class: 'num' }, String(i + 1)));
      if (v.escena) {
        esc.insertAdjacentHTML('beforeend', AE.escenaSVG(v.escena, { clase: 'fondo' }));
        esc.appendChild(el('span', { class: 'pic-esc', title: ES[v.escena].nombre }, ES[v.escena].emoji));
        const pjs = el('div', { class: 'personajes' + (v.personajes.length ? '' : ' vacia') });
        esc.appendChild(pjs);
        esc.appendChild(el('button', { class: 'quitar', title: 'Quitar la escena', onclick: ev => { ev.stopPropagation(); viñetas[i] = { escena: null, personajes: [] }; pintarTira(); simular(); } }, '×'));
      }
      // soltar
      esc.addEventListener('dragover', ev => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; esc.classList.add('sobre'); });
      esc.addEventListener('dragleave', () => esc.classList.remove('sobre'));
      esc.addEventListener('drop', ev => { ev.preventDefault(); esc.classList.remove('sobre'); const [tipo, id] = (ev.dataTransfer.getData('text/plain') || '').split(':'); if (cartaValida(tipo, id)) colocar(i, tipo, id); });
      esc.addEventListener('click', () => { if (seleccion && colocar(i, seleccion.tipo, seleccion.id)) seleccionar(null); });
      caja.appendChild(esc);
      const frase = el('div', { class: 'frase vacia', title: 'Escuchar' }, '…');
      frase.addEventListener('click', ev => { if (ev.target.closest('button,input,label')) return; if (frase.dataset.texto) hablar(frase.dataset.texto); });
      caja.appendChild(frase);
      tira.appendChild(caja);
    });
    ajustarTira();
  }
  /* Ancho máximo de cada viñeta para que la imagen (16:10) y unas 3 líneas de frase quepan en la altura disponible, sin recortes. */
  function ajustarTira() {
    const tira = $('#tira');
    const h = tira.clientHeight;
    if (!h) return;
    const f = tira.querySelector('.frase');
    const linea = f ? parseFloat(getComputedStyle(f).fontSize) * 1.3 : 20;
    const escritor = !!(window.SVApp && window.SVApp.escritor && window.SVApp.escritor.activo());
    // en modo escritor hacen falta 3 frases (elegir) o un campo con su pista (escribir) bajo cada imagen
    const lineas = !escritor ? 3.4 : ajustes().escritorNivel === 'escribir' ? 4.6 : 3.8;
    const wmax = Math.max(220, Math.floor((h - linea * lineas - 6) * 1.6));
    tira.style.setProperty('--wmax', wmax + 'px');
  }
  window.addEventListener('resize', ajustarTira);
  /* Solo se aceptan las cartas del nivel (un texto arrastrado desde una frase llega también como text/plain). */
  function cartaValida(tipo, id) {
    if (tipo === 'escena') return nivel.escenas.includes(id);
    if (tipo === 'personaje') return nivel.personajes.includes(id);
    return false;
  }
  /** Coloca una carta en la viñeta i. Devuelve true si la colocación se ha hecho. */
  function colocar(i, tipo, id) {
    const v = viñetas[i];
    if (!v || !cartaValida(tipo, id)) return false;
    if (tipo === 'escena') {
      v.escena = id;
      const slots = ES[id].slots;
      if (v.personajes.length > slots) v.personajes = v.personajes.slice(0, slots);
    } else {
      if (!v.escena) { toast('Primero pon una escena en la viñeta.'); return false; }
      if (v.personajes.includes(id)) { toast(`${PJ[id].nombre} ya está en esta viñeta.`); return false; }
      const slots = ES[v.escena].slots;
      if (v.personajes.length >= slots) { if (slots === 1) v.personajes = [id]; else v.personajes[slots - 1] = id; }
      else v.personajes.push(id);
    }
    pintarTira(); simular();
    return true;
  }
  function quitarPersonaje(i, id) { viñetas[i].personajes = viñetas[i].personajes.filter(x => x !== id); pintarTira(); simular(); }

  function simular() {
    res = E.simular(nivel, viñetas, { tiempo: tiempo() });
    const escritor = !!(window.SVApp.escritor && window.SVApp.escritor.activo());
    // personajes y frases
    document.querySelectorAll('.vineta').forEach((caja, i) => {
      const v = viñetas[i], r = res.viñetas[i];
      const pjs = caja.querySelector('.personajes');
      if (pjs) {
        pjs.innerHTML = '';
        for (const id of r.personajes) {
          const ex = r.estado[id] ? E.expresion(r.estado[id]) : 'contento';
          const w = el('div', { class: 'pj-wrap', title: `${PJ[id].nombre} — clic para quitar` });
          w.innerHTML = AP.personajeSVG(PJ[id], ex, { clase: 'pj' });
          // Con una carta seleccionada, el clic va a la viñeta (poner la carta); sin selección, quita al personaje.
          w.addEventListener('click', ev => { if (seleccion) return; ev.stopPropagation(); quitarPersonaje(i, id); });
          pjs.appendChild(w);
        }
      }
      const f = caja.querySelector('.frase');
      f.dataset.texto = '';
      if (!v.escena) { f.textContent = '…'; f.className = 'frase vacia'; }
      else if (!v.personajes.length) { f.textContent = `${ES[v.escena].nombre}. ¿Quién está aquí?`; f.className = 'frase vacia'; }
      else if (r.frases.length) {
        const texto = r.frases.join(' ');
        const alerta = r.eventos.some(e => e.tipo === 'yaSalvo' || e.tipo === 'demasiados');
        f.dataset.texto = texto;
        f.className = 'frase' + (alerta ? ' alerta' : '');
        // Una frase de aviso (historia incoherente) se muestra siempre: no es una frase que adivinar.
        if (escritor && !alerta) window.SVApp.escritor.pintar(f, i, texto, res); else f.textContent = texto;
      }
      else { f.textContent = '…'; f.className = 'frase vacia'; }
    });
    // estado del nivel
    const est = $('#estadoNivel'), tt = $('#tituloTxt');
    if (window.SVApp.alSimular) window.SVApp.alSimular(res);
    if (nivel.libre || nivel.enConstruccion) { est.textContent = res.incompleto ? `${viñetas.filter(v => v.escena && v.personajes.length).length}/${nivel.viñetas} viñetas` : (nivel.enConstruccion && !res.valido ? 'Hay un problema: mira la frase en rojo' : '¡Historia completa!'); est.className = res.incompleto || !res.valido ? '' : 'ok'; $('#btnImprimir').disabled = res.incompleto; return; }
    tt.classList.toggle('ok', res.resuelto);
    $('#btnImprimir').disabled = !res.resuelto || escritorPendiente(); // en modo escritor, imprimir revelaría las frases
    if (res.resuelto) { est.textContent = '✔ ¡Muy bien!' + (res.secreto ? ' 🔑 ¡Título secreto!' : ''); est.className = 'ok'; exito(); }
    else if (res.incompleto || res.faltan.length) { est.textContent = ''; est.className = ''; }
    else { est.textContent = 'Todavía no…'; est.className = ''; fallo(); }
  }
  let ultimoFallo = '';
  function fallo() {
    const firma = JSON.stringify(viñetas);
    if (firma === ultimoFallo) return;
    ultimoFallo = firma; intentos++;
    const pistas = nivel.pistas || [];
    if (!pistas.length) return;
    // ★ pista automática cada 2 fallos · ★★ una pista al 4.º fallo · ★★★ nunca
    if (dif() === 1 && intentos % 2 === 0) toast('💡 ' + pistas[(intentos / 2 - 1) % pistas.length], 6000);
    else if (dif() === 2 && intentos === 4) toast('💡 ' + pistas[0], 6000);
  }
  let exitoMostrado = '', avisoEscritor = '';
  /* La historia cumple el título. Si el modo escritor sigue pendiente, solo se avisa: las estrellas y la fiesta llegan al terminar las frases. */
  function exito() {
    const firma = nivel.id + '|' + JSON.stringify(viñetas);
    if (escritorPendiente()) {
      if (avisoEscritor !== firma) { avisoEscritor = firma; toast(ajustes().escritorNivel === 'escribir' ? '✔ La historia es correcta. Ahora escribe la frase de cada viñeta.' : '✔ La historia es correcta. Ahora elige la frase de cada viñeta.', 4500); }
      return;
    }
    if (firma === exitoMostrado) return;
    exitoMostrado = firma;
    const p = progresoDe(nivel.id);
    p.estrellas = Math.max(p.estrellas || 0, intentos <= 1 ? 3 : intentos <= 3 ? 2 : 1);
    if (res.secreto) p.secreto = true;
    progreso[nivel.id] = p; guardar();
    pintarNiveles();
    mostrarExito(p);
  }
  function escritorPendiente() { return !!(window.SVApp.escritor && window.SVApp.escritor.activo() && !window.SVApp.escritor.completo()); }
  function mostrarExito(p) {
    p = p || progresoDe(nivel.id);
    const d = $('#dlgExito');
    const sec = res.secreto ? `<p>🔑 Título secreto: <b>${esc(tituloSecreto(nivel))}</b></p>` : (nivel.secreto ? '<p class="alt">Hay un título secreto en este nivel… ¿lo encuentras?</p>' : '');
    d.innerHTML = `<h2>¡Muy bien!</h2><div class="grande">${'★'.repeat(p.estrellas || 0)}${'☆'.repeat(3 - (p.estrellas || 0))}</div>
      <p><b>${esc(nivel.titulo)}</b></p>${sec}
      <div class="fila"><button class="btn sec" id="btnSeguir">Cerrar</button><button class="btn sec" id="btnImprimirDlg">🖨 Imprimir</button><button class="btn" id="btnLeer">Leer la historia</button><button class="btn verde" id="btnSig">Siguiente nivel →</button></div>`;
    d.querySelector('#btnSeguir').onclick = () => d.close();
    d.querySelector('#btnLeer').onclick = () => { d.close(); quePasa(); };
    d.querySelector('#btnSig').onclick = () => { d.close(); siguienteNivel(); };
    const bi = d.querySelector('#btnImprimirDlg');
    if (window.SVApp.imprimir) bi.onclick = () => { d.close(); window.SVApp.imprimir(); }; else bi.hidden = true;
    setTimeout(() => { if (!d.open) d.showModal(); }, 350);
    hablar(res.frasesTodas.join(' '));
  }

  /* ---------- ¿Qué pasa? ---------- */
  function quePasa() {
    const d = $('#dlgQuePasa');
    // En modo escritor, las frases que el alumno todavía no ha elegido o escrito no se muestran aquí (se conserva el diagnóstico).
    const oculto = escritorPendiente();
    const visible = i => !oculto || window.SVApp.escritor.hecha(i);
    const partes = res.viñetas.map((v, i) => `<p data-f="${i}"${visible(i) ? '' : ' class="oculta"'}><b>${i + 1}.</b> ${!v.frases.length ? '<i>…</i>' : visible(i) ? v.frases.join(' ') : '<i>¿Qué frase es? Mírala en la viñeta.</i>'}</p>`).join('');
    const resumen = res.resumen.length ? `<h3>Al final</h3>${res.resumen.map(s => `<p class="res">${s}</p>`).join('')}` : '';
    let juicio = '';
    if (!nivel.libre) {
      if (res.resuelto) juicio = `<div class="porque ok">✔ ¡Muy bien! Esta historia es: «${esc(nivel.titulo)}».</div>`;
      else if (res.porque.length) juicio = `<div class="porque">${res.porque.map(p => `<div>✗ ${esc(p)}</div>`).join('')}</div>`;
    }
    d.innerHTML = `<h2>¿Qué pasa?</h2><div class="historia">${partes}${resumen}</div>${juicio}
      <div class="fila"><button class="btn sec" id="btnOir">🔊 Escuchar todo</button><button class="btn" id="btnCerrar">Cerrar</button></div>`;
    d.querySelectorAll('.historia p').forEach(p => p.addEventListener('click', () => { if (!p.classList.contains('oculta')) hablar(p.textContent.replace(/^\d+\.\s*/, '')); }));
    d.querySelector('#btnOir').onclick = () => hablar(res.viñetas.filter((v, i) => visible(i)).map(v => v.frases.join(' ')).concat(res.resumen).join(' '));
    d.querySelector('#btnCerrar').onclick = () => d.close();
    d.showModal();
  }

  /* ---------- paneles ---------- */
  function cerrarPaneles() { $('#panelNiveles').hidden = true; $('#panelLexico').hidden = true; $('#menuDif').hidden = true; }
  function pintarNiveles() {
    const p = $('#panelNiveles');
    const caps = { 1: 'Capítulo 1 · Solo en la selva', 2: 'Capítulo 2 · Juntos', 3: 'Capítulo 3 · El grupo', 0: 'Nivel libre', 9: 'Niveles de la clase' };
    const vis = nivelesVisibles();
    let html = `<h2>Niveles <button class="btn sec cerrar" aria-label="Cerrar">×</button></h2>`;
    for (const c of [1, 2, 3, 0, 9]) {
      const lista = vis.filter(n => (c === 9 ? n.autor : n.capitulo === c && !n.autor));
      if (!lista.length) continue;
      html += `<h3>${caps[c]}</h3>`;
      for (const n of lista) {
        const pr = progresoDe(n.id);
        const est = n.libre ? '' : `<span class="estrellas">${'★'.repeat(pr.estrellas || 0)}${'☆'.repeat(3 - (pr.estrellas || 0))}${pr.secreto ? ' 🔑' : ''}</span>`;
        html += `<button class="niv${esActual(n) ? ' actual' : ''}${pr.estrellas ? ' hecho' : ''}" data-id="${esc(n.id)}"><span class="cnt">${n.libre ? '✎' : n.viñetas + ' ▭'}</span><span>${esc(n.titulo)}</span>${est}</button>`;
      }
    }
    if (window.SVApp.abrirAutor) html += `<h3>Crear</h3><button class="btn sec" id="btnIrAutor">✎ Crear un nivel</button> <button class="btn sec" id="btnImportar">⌨ Tengo un código</button>`;
    html += `<h3>Datos</h3><button class="btn sec" id="btnBorrarDatos">Borrar mis datos</button><p class="nota">Borra las estrellas y los ajustes del juego de este navegador. Los niveles de la clase se quedan. Ningún dato sale de este ordenador.</p>`;
    p.innerHTML = html;
    p.querySelector('.cerrar').onclick = () => { p.hidden = true; };
    p.querySelectorAll('.niv').forEach(b => b.onclick = () => { p.hidden = true; abrirNivel(b.dataset.id); });
    p.querySelector('#btnBorrarDatos').onclick = () => { if (confirm('¿Borrar tus estrellas y los ajustes del juego en este navegador?')) { borrarMisDatos(); toast('Datos borrados.'); } };
    const ia = p.querySelector('#btnIrAutor'); if (ia) ia.onclick = () => { p.hidden = true; window.SVApp.abrirAutor(); };
    const im = p.querySelector('#btnImportar'); if (im) im.onclick = () => { p.hidden = true; window.SVApp.importarCodigo(); };
  }
  /* Alumno: estrellas, nivel actual y ajustes de juego. Se conservan el modo, la contraseña del profe y los niveles de la clase. */
  function borrarMisDatos() {
    const a = ajustes(), conservar = { modo: a.modo, clave: a.clave, escritor: a.escritor, escritorNivel: a.escritorNivel, preterito: a.preterito };
    progreso = { ajustes: Object.assign({ dif: 2 }, conservar) }; guardar();
    if (window.SVApp.escritor) window.SVApp.escritor.reiniciar();
    abrirNivel(nivel && !nivel.enConstruccion ? nivel.id : C.NIVELES[0].id);
  }
  /* Profe: todo lo que el juego guarda en este navegador (progreso, ajustes, contraseña, niveles de la clase, barra de clase). */
  function borrarTodo() {
    // la barra de clase se desmonta antes de borrar su almacenamiento (si no, volvería a guardar nombres y puntos)
    if (pizarraApi) { try { pizarraApi.destruir(); } catch (_) { /* nada */ } pizarraApi = null; delete $('#clase').dataset.montado; }
    progreso = {}; guardar();
    if (window.SVApp.borrarDatos) window.SVApp.borrarDatos();
    extra = [];
    document.body.classList.remove('pizarra'); document.documentElement.classList.remove('pizarra');
    $('#clase').hidden = true; $('#btnClase').hidden = true;
    abrirNivel(C.NIVELES[0].id); pintarInicio();
  }
  function pintarLexico() {
    const p = $('#panelLexico');
    const lex = E.lexicoDe(nivel);
    p.innerHTML = `<h2>Léxico <button class="btn sec cerrar" aria-label="Cerrar">×</button></h2><p class="nota">Palabras de este nivel. Haz clic para escuchar.</p><div class="lex">${lex.map(w => `<button data-w="${w.palabra}"><span>${w.picto}</span><span>${w.palabra}</span></button>`).join('')}</div>`;
    p.querySelector('.cerrar').onclick = () => { p.hidden = true; };
    p.querySelectorAll('.lex button').forEach(b => b.onclick = () => hablar(b.dataset.w));
  }

  /* ---------- botones ---------- */
  $('#btnInicio').onclick = pintarInicio;
  $('#btnNiveles').onclick = () => { const p = $('#panelNiveles'); const h = p.hidden; cerrarPaneles(); p.hidden = !h; };
  $('#btnLexico').onclick = () => { const p = $('#panelLexico'); const h = p.hidden; cerrarPaneles(); p.hidden = !h; };
  $('#btnQuePasa').onclick = quePasa;
  $('#btnReiniciar').onclick = () => { viñetas = viñetas.map(() => ({ escena: null, personajes: [] })); seleccionar(null); pintarTira(); simular(); };
  $('#btnPista').onclick = () => {
    if (nivel.libre) { toast('Aquí no hay pistas: ¡inventa tu historia!'); return; }
    if (!nivel.pistas || !nivel.pistas.length) { toast('Este nivel no tiene pistas. Lee bien el título.'); return; }
    toast('💡 ' + nivel.pistas[pistaIdx % nivel.pistas.length], 6000); pistaIdx++;
  };
  $('#btnClase').onclick = () => { const c = $('#clase'); c.hidden = !c.hidden; ajustes().clase = !c.hidden; guardar(); ajustarTira(); };
  $('#btnDif').onclick = ev => { ev.stopPropagation(); const m = $('#menuDif'); const h = m.hidden; cerrarPaneles(); m.hidden = !h; };
  document.querySelectorAll('#menuDif button').forEach(b => b.onclick = () => ponerDif(+b.dataset.d));
  document.addEventListener('click', ev => { if (!ev.target.closest('.dif')) $('#menuDif').hidden = true; });
  $('#tituloTxt').onclick = () => hablar(nivel.libre ? 'Mi historia' : nivel.titulo);
  document.querySelectorAll('#inicioApp [data-modo]').forEach(b => b.onclick = () => elegirModo(b.dataset.modo));
  $('#cardAutor').onclick = () => { if (window.SVApp.abrirAutor) { if (!ajustes().modo) elegirModo('solo'); $('#inicioApp').hidden = true; window.SVApp.abrirAutor(); } };
  document.addEventListener('keydown', ev => {
    const t = ev.target;
    if (t && t.matches && (t.matches('input,textarea,select') || t.isContentEditable)) return;
    if (ev.key === 'Escape') { seleccionar(null); cerrarPaneles(); }
    if ((ev.key === 'p' || ev.key === 'P') && !ev.ctrlKey && !ev.metaKey && !ev.altKey && window.SVApp.abrirProfe && !document.querySelector('dialog[open]')) { ev.preventDefault(); window.SVApp.abrirProfe(); }
  });

  /* ---------- ganchos para los módulos (ui-modos.js) ---------- */
  window.SVApp = {
    nivel: () => nivel, viñetas: () => viñetas, resultado: () => res, progreso: () => progreso, ajustes, guardar, hablar, toast,
    abrirNivel, pintarTodo, simular, elegirModo, pintarInicio, nivelesVisibles, tiempo, dif, tituloSecreto, mostrarExito,
    añadirNiveles(ns) { extra = ns.slice(); },
    extra: () => extra,
    ponerViñetas(vs, opts) { viñetas = Array.from({ length: nivel.viñetas }, (_, i) => ({ escena: vs[i] ? vs[i].escena : null, personajes: vs[i] ? vs[i].personajes.slice() : [] })); if (opts && opts.silencio) exitoMostrado = avisoEscritor = nivel.id + '|' + JSON.stringify(viñetas); seleccionar(null); pintarTira(); simular(); },
    reiniciarIntentos() { intentos = 0; ultimoFallo = ''; exitoMostrado = ''; avisoEscritor = ''; },
    ajustarTira, esc, cerrarPaneles, borrarTodo,
    escritor: null, abrirAutor: null, abrirProfe: null, imprimir: null, importarCodigo: null, borrarDatos: null, alPintar: null
  };

  /* ---------- inicio ---------- */
  function arrancar() {
    if (window.SVApp.iniciarModulos) { try { window.SVApp.iniciarModulos(); } catch (e) { console.error(e); } }
    // Parámetros opcionales en la URL (para el profe o las pruebas): ?modo=pizarra|solo&nivel=c2n1&dif=1|2|3
    const q = new URLSearchParams(location.search);
    if (q.get('dif') && ['1', '2', '3'].includes(q.get('dif'))) ajustes().dif = +q.get('dif');
    if (q.get('nivel') && todosNiveles().some(n => n.id === q.get('nivel'))) progreso.actual = q.get('nivel');
    if (q.get('modo') === 'pizarra' || q.get('modo') === 'solo') ajustes().modo = q.get('modo');
    pintarDif();
    if (ajustes().modo) elegirModo(ajustes().modo); else { abrirNivel(progreso.actual || C.NIVELES[0].id); pintarInicio(); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar); else arrancar();
})();

</script>
<script>/* ui-modos.js */
/* Cuéntalo — módulos de interfaz de la fase 2: modo escritor, Imprimir mi historia, modo Autor, panel Profe.
   Se engancha a window.SVApp (definido en ui.js). Vanilla JS, sin dependencias, todo en localStorage. */
(function () {
  'use strict';
  const C = window.SVContenido, E = window.SVEngine, AP = window.SVArtePersonajes, AE = window.SVArteEscenas;
  const ESC = window.SVEscritor, AU = window.SVAutor;
  const App = window.SVApp;
  const $ = s => document.querySelector(s);
  const PJ = {}; for (const p of C.PERSONAJES) PJ[p.id] = p;
  const ES = {}; for (const e of C.ESCENAS) ES[e.id] = e;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const el = (tag, attrs, html) => { const n = document.createElement(tag); if (attrs) for (const k in attrs) { if (k === 'class') n.className = attrs[k]; else n.setAttribute(k, attrs[k]); } if (html !== undefined) n.innerHTML = html; return n; };
  const store = { getItem: k => { try { return localStorage.getItem(k); } catch (_) { return null; } }, setItem: (k, v) => { try { localStorage.setItem(k, v); } catch (_) { /* nada */ } }, removeItem: k => { try { localStorage.removeItem(k); } catch (_) { /* nada */ } } };
  const almacen = AU.almacen(store);
  const CLAVE_DEFECTO = 'profe';

  /* =====================================================================
     1. MODO ESCRITOR: la frase se oculta; el alumno la elige entre 3 o la escribe
     ===================================================================== */
  const estadosEsc = {}; // índice de viñeta → { firma, malas, intentos, hecho, revelada, escrito }
  function escActivo() {
    const n = App.nivel();
    if (!n || n.libre || n.enConstruccion) return false;
    return !!(App.ajustes().escritor || App.dif() === 3);
  }
  function escModo() { return App.ajustes().escritorNivel === 'escribir' ? 'escribir' : 'elegir'; }
  function estadoDe(i, texto) {
    let s = estadosEsc[i];
    if (!s || s.firma !== texto) s = estadosEsc[i] = { firma: texto, malas: [], intentos: 0, hecho: false, revelada: false, escrito: '' };
    return s;
  }
  const esAviso = v => v.eventos.some(e => e.tipo === 'yaSalvo' || e.tipo === 'demasiados');
  function escHecha(i) {
    const v = App.resultado().viñetas[i], s = estadosEsc[i];
    if (!v || !v.frases.length || esAviso(v)) return true;
    return !!(s && s.hecho && s.firma === v.frases.join(' '));
  }
  function escCompleto() { return App.resultado().viñetas.every((v, i) => escHecha(i)); }
  function escPintar(f, i, texto, res) {
    const s = estadoDe(i, texto);
    f.classList.add('esc');
    if (s.hecho) { f.innerHTML = `<span class="esc-ok" title="${s.revelada ? 'Frase mostrada' : '¡Correcta!'}">${s.revelada ? '👀' : '✔'}</span>${esc(texto)}`; f.dataset.texto = texto; f.classList.remove('esc'); return; }
    f.dataset.texto = ''; // no se lee al hacer clic: solo con el botón 🔊
    const oir = `<button class="btn sec mini oir" type="button" title="Escuchar la frase">🔊</button>`;
    if (escModo() === 'elegir') {
      // En la viñeta solo hay un botón: las 3 frases se leen en grande en una ventana (en una viñeta estrecha aplastaban la imagen).
      f.innerHTML = `<div class="esc-cab"><b>¿Qué frase es?</b>${oir}</div><button type="button" class="btn esc-abrir">Elegir la frase</button>`;
      f.querySelector('.esc-abrir').addEventListener('click', ev => { ev.stopPropagation(); elegirFrase(i, s, texto, res); });
    } else {
      f.innerHTML = `<div class="esc-cab"><b>Escribe la frase</b>${oir}</div>
        <form class="esc-form"><input type="text" class="esc-in" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Escribe aquí…" value="${esc(s.escrito)}" aria-label="Escribe la frase de la viñeta ${i + 1}"><button class="btn sec mini enie" type="button" title="Escribir ñ">ñ</button><button class="btn mini" type="submit" title="Comprobar">✔</button></form>
        ${s.intentos >= 2 ? `<div class="esc-pista" title="Pista: la primera letra de cada palabra">${esc(ESC.pista(texto))}</div>` : ''}
        ${s.intentos >= 4 ? `<button type="button" class="btn sec mini esc-ver">Ver la frase</button>` : ''}`;
      const form = f.querySelector('form'), input = f.querySelector('input');
      input.addEventListener('input', () => { s.escrito = input.value; });
      f.querySelector('.enie').addEventListener('click', ev => { // inserta «ñ» donde está el cursor
        ev.stopPropagation();
        const a = input.selectionStart == null ? input.value.length : input.selectionStart, b = input.selectionEnd == null ? a : input.selectionEnd;
        input.value = input.value.slice(0, a) + 'ñ' + input.value.slice(b); s.escrito = input.value;
        input.focus(); input.setSelectionRange(a + 1, a + 1);
      });
      form.addEventListener('submit', ev => {
        ev.preventDefault(); ev.stopPropagation();
        const r = ESC.comparar(input.value, texto);
        s.escrito = input.value;
        if (r.ok) acierta(i, s, texto, r.mensaje);
        else {
          s.intentos++;
          App.toast(r.mensaje, 4000);
          App.simular();
          const nuevo = document.querySelector(`.vineta[data-i="${i}"] .esc-in`);
          if (nuevo) { nuevo.focus(); nuevo.select(); }
        }
      });
      const ver = f.querySelector('.esc-ver');
      if (ver) ver.addEventListener('click', ev => { ev.stopPropagation(); s.revelada = true; acierta(i, s, texto, 'Aquí tienes la frase. Léela y escúchala.'); });
    }
    f.querySelector('.oir').addEventListener('click', ev => { ev.stopPropagation(); App.hablar(texto); });
  }
  function elegirFrase(i, s, texto, res) {
    const op = ESC.opciones(App.nivel(), App.viñetas(), i, res, { tiempo: App.tiempo() });
    const v = res.viñetas[i];
    const dibujo = `<div class="esc-dibujo">${AE.escenaSVG(v.escena, { clase: 'fondo' })}<div class="pjs">${v.personajes.map(id => AP.personajeSVG(PJ[id], v.estado[id] ? E.expresion(v.estado[id]) : 'contento', { clase: 'pj' })).join('')}</div></div>`;
    const d = dialogo(`<h2>Viñeta ${i + 1}: ¿qué frase es?</h2>${dibujo}<div class="esc-ops">${op.opciones.map((t, k) => `<button type="button" class="esc-op${s.malas.includes(k) ? ' mal' : ''}" data-k="${k}"${s.malas.includes(k) ? ' disabled' : ''}>${esc(t)}</button>`).join('')}</div>
      <div class="fila"><button class="btn sec" id="eOir" type="button">🔊 Escuchar</button><button class="btn" type="button" data-cerrar>Cerrar</button></div>`, 'escritor');
    d.querySelector('#eOir').addEventListener('click', () => App.hablar(texto));

  }
  App.escritor = { activo: escActivo, pintar: escPintar, completo: escCompleto, hecha: escHecha, reiniciar() { for (const k in estadosEsc) delete estadosEsc[k]; } };

  /* =====================================================================
     2. IMPRIMIR MI HISTORIA (A4 apaisado): el cómic resuelto + hojas de viñetas vacías (4 y 6)

  /** HTML de las tres páginas (cómic resuelto + hojas de 4 y 6 viñetas). Función pura: también la usa test/imprimir.js. */

  /* =====================================================================
     3. MODO AUTOR: crear un nivel, jugar la solución, guardar y compartir con un código
     ===================================================================== */
  let barra = null;
  const HUMANOS = C.PERSONAJES.filter(p => !p.animal).map(p => p.id);
  const OFICIALES = new Set(C.NIVELES.map(n => n.id));
  /** ¿Es un nivel de autor jugable? (estructura mínima, cartas conocidas, objetivo válido) */
  function nivelValido(n) {
    try {
      if (!n || typeof n !== 'object' || typeof n.id !== 'string' || !n.id.startsWith('autor-') || OFICIALES.has(n.id)) return false;
      if (typeof n.titulo !== 'string' || !n.titulo.trim() || n.titulo.length > 120) return false;
      if (!Number.isInteger(n.viñetas) || n.viñetas < 1 || n.viñetas > 6) return false;
      if (!Array.isArray(n.escenas) || !n.escenas.length || n.escenas.length > 8 || !n.escenas.every(id => ES[id])) return false;
      if (!Array.isArray(n.personajes) || !n.personajes.length || n.personajes.length > 4 || !n.personajes.every(id => HUMANOS.includes(id)) || new Set(n.personajes).size !== n.personajes.length) return false;
      if (!E.objetivoValido(n.objetivo)) return false;
      E.simular(n, []); // debe poder simularse sin lanzar
      return true;
    } catch (_) { return false; }
  }
  function recargarExtra() { App.añadirNiveles(almacen.listar().filter(nivelValido)); }
  function dialogo(html, clase) {
    const d = $('#dlgModos');

  function tarjetasSel(tipo, ids, marcados) {

      const e = ES[id]; return `<label class="sel-carta"><input type="checkbox" name="esc" value="${id}"${sel ? ' checked' : ''}>${AE.escenaSVG(id)}<span>${e.emoji} ${e.nombre}</span></label>`;
    }).join('')}</div>`;
  }
  function abrirAutor(base) {
    base = base || { personajes: ['lucia', 'mateo'], escenas: ['selva', 'rio', 'noche'], viñetas: 3 };
    const humanos = C.PERSONAJES.filter(p => !p.animal).map(p => p.id);
    const d = dialogo(`<h2>✎ Crear un nivel <button class="btn sec" data-cerrar aria-label="Cerrar">×</button></h2>
      <form id="fAutor">

        <fieldset><legend>3. Viñetas</legend><div class="fila-radios">${[2, 3, 4, 5, 6].map(k => `<label class="radio"><input type="radio" name="vin" value="${k}"${k === base.viñetas ? ' checked' : ''}> ${k}</label>`).join('')}</div></fieldset>

    });

    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      const pjs = elegidos('pj'), escs = elegidos('esc'), vin = +(form.querySelector('input[name="vin"]:checked') || {}).value || 3;
      if (!pjs.length || pjs.length > 4) { App.toast('Elige de 1 a 4 personajes.'); return; }
      if (!escs.length || escs.length > 8) { App.toast('Elige de 1 a 8 escenas.'); return; }
      let titulo, objetivo = null;
      if (sel.value === 'libre') { titulo = libre.value.trim(); if (!titulo) { App.toast('Escribe tu título.'); libre.focus(); return; } }
      else { const t = titulos[+sel.value]; if (!t) { App.toast('Elige un título.'); return; } titulo = t.titulo; objetivo = t.objetivo; }
      const nivel = { id: 'autor-nuevo', capitulo: 0, autor: true, enConstruccion: true, titulo, viñetas: vin, escenas: escs, personajes: pjs, objetivo, pistas: [] };
      if (objetivo) { // el asistente mira las cartas, no el número de viñetas: se comprueba que el título tenga solución
        const boton = form.querySelector('button[type="submit"]');
        boton.disabled = true; nota.classList.remove('error'); nota.textContent = 'Comprobando el título…';
        const r = await resolverAsync(nivel, { max: 1, limite: 3e5 }, 4000); // null = tiempo agotado: se deja pasar
        boton.disabled = false;
        if (r && !r.desbordado && !r.total) {
          nota.textContent = `«${titulo}» no tiene solución con estas cartas y ${vin} viñetas. Elige otro título, más viñetas u otras cartas.`;
          nota.classList.add('error');
          return;
        }
      }
      d.close();
      jugarSolucion(nivel);
    });
  }
  function jugarSolucion(nivel) {
    App.añadirNiveles(almacen.listar().concat([nivel]));
    App.abrirNivel('autor-nuevo');
    if (!barra) { barra = el('div', { id: 'barraAutor', role: 'status' }); $('#titulo').appendChild(barra); }
    barra.hidden = false;

  function autorListo(res) {
    const n = App.nivel();
    if (!n || !n.enConstruccion) return false;
    if (res.incompleto || !res.valido || (res.faltan && res.faltan.length)) return false;
    return n.objetivo ? res.resuelto : true;
  }
  function guardarNivel(nivel) {
    let final = Object.assign({}, nivel);
    delete final.enConstruccion;
    try { if (!final.objetivo) final = AU.grabar(final, App.viñetas()); } catch (e) { App.toast(e.message, 4000); return; }
    // Comprobación inmediata con la historia jugada (sin buscar todas las soluciones)
    const jugada = E.simular(final, App.viñetas());
    if (!jugada.resuelto || !nivelValido(Object.assign({}, final, { id: 'autor-x' }))) { dialogo(`<h2>Todavía no</h2><div class="porque">${(jugada.porque.length ? jugada.porque : ['Este nivel no se puede guardar.']).map(e => `<div>✗ ${esc(e)}</div>`).join('')}</div><div class="fila"><button class="btn" data-cerrar>Cerrar</button></div>`); return; }
    {
      let codigo;
      try { codigo = AU.codificar(final); } catch (e) { dialogo(`<h2>Todavía no</h2><div class="porque"><div>✗ Esta historia es demasiado larga para un código. Usa menos viñetas o menos personajes.</div></div><div class="fila"><button class="btn" data-cerrar>Cerrar</button></div>`); return; }
      final.id = 'autor-' + codigo.replace(/[^0-9A-Z]/g, '').toLowerCase();

        <p class="nota">Las letras I, L, O y U no se usan: si lees «O», es un cero; si lees «I» o «L», es un uno.</p>
        <div class="fila"><button class="btn sec" id="bCopiar">Copiar</button><button class="btn sec" id="bOtro">Crear otro</button><button class="btn verde" id="bJugar">Jugar este nivel</button></div>`);
      d.querySelector('#bCopiar').addEventListener('click', () => { try { navigator.clipboard.writeText(codigo); App.toast('Código copiado.'); } catch (_) { App.toast('No se puede copiar aquí: cópialo a mano.'); } });
      d.querySelector('#bOtro').addEventListener('click', () => { d.close(); abrirAutor({ personajes: final.personajes, escenas: final.escenas, viñetas: final.viñetas }); });

      resolverAsync(final, { max: 1, limite: 3e5 }, 20000).then(r => {

        if (!r || r.desbordado) { const k = Math.max(1, r ? r.total : 0); info.textContent = `al menos ${k} ${k === 1 ? 'solución (la tuya)' : 'soluciones'}: demasiadas combinaciones para contarlas todas`; }
        else info.textContent = `${r.total} ${r.total === 1 ? 'solución' : 'soluciones'}`;
      });
    }
  }
  function importarCodigo(codigoInicial) {
    const d = dialogo(`<h2>⌨ Tengo un código</h2><form id="fCodigo"><input type="text" id="cIn" class="codigo-in" autocomplete="off" spellcheck="false" placeholder="S1AB-CDEF-GHJK-M" value="${esc(codigoInicial || '')}" aria-label="Código del nivel"><p class="nota" id="cNota">Copia el código de la pizarra. Puedes escribirlo en minúsculas y sin guiones.</p>
      <div class="fila"><button class="btn sec" type="button" data-cerrar>Cancelar</button><button class="btn verde" type="submit">Abrir el nivel</button></div></form>`);
    const form = d.querySelector('#fCodigo'), input = d.querySelector('#cIn'), nota = d.querySelector('#cNota');

  /* =====================================================================
     4. PANEL PROFE (tecla P): contraseña local, ajustes, soluciones, niveles de la clase
     ===================================================================== */
  let autorizado = false;
  function clave() { return App.ajustes().clave || CLAVE_DEFECTO; }
  function abrirProfe() {
    if (autorizado) { panelProfe(); return; }
    const d = dialogo(`<h2>Profe</h2><form id="fClave"><label>Contraseña <input type="password" id="pIn" autocomplete="off" aria-label="Contraseña"></label><p class="nota" id="pNota">Solo para el profe o la profe.</p>
      <div class="fila"><button class="btn sec" type="button" data-cerrar>Cancelar</button><button class="btn" type="submit">Entrar</button></div></form>`);
    const input = d.querySelector('#pIn');
    setTimeout(() => input.focus(), 50);
    d.querySelector('#fClave').addEventListener('submit', ev => {
      ev.preventDefault();
      if (input.value === clave()) { autorizado = true; d.close(); panelProfe(); }
      else { d.querySelector('#pNota').textContent = 'No es la contraseña.'; d.querySelector('#pNota').classList.add('error'); input.value = ''; input.focus(); }
    });
  }
  /* Resolver en segundo plano con un Worker construido a partir de los propios <script> inlinados (sin ficheros externos);
     si el navegador no lo permite (file:// en algún navegador), se calcula en el hilo principal. */
  let workerURL = null;
  /** Resuelve en un Worker. Devuelve null si no se pudo (tiempo agotado, Worker imposible y nivel demasiado grande). */
  function resolverAsync(nivel, opts, ms) {
    return new Promise(resolve => {
      const sincrono = () => {
        const posibles = Math.pow(E.opcionesDe(nivel).length, nivel.viñetas);
        try { resolve(posibles <= 2e6 ? E.resolver(nivel, opts) : null); } catch (_) { resolve(null); }
      };
      let w;
      try {
        if (!workerURL) {
          const fuentes = [...document.scripts].filter(s => /\/\* (lengua|contenido|engine)\.js \*\//.test(s.textContent.slice(0, 80))).map(s => s.textContent);
          if (fuentes.length !== 3) throw new Error('sin fuentes');
          const code = fuentes.join('\n') + '\nself.onmessage = function (ev) { const r = self.SVEngine.resolver(ev.data.nivel, ev.data.opts); self.postMessage({ total: r.total, secretas: r.secretas, ambas: r.ambas, soluciones: r.soluciones, densidad: r.densidad, desbordado: r.desbordado }); };';
          workerURL = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        }
        w = new Worker(workerURL);
      } catch (_) { sincrono(); return; }
      const t = setTimeout(() => { w.terminate(); resolve(null); }, ms || 45000);
      w.onmessage = ev => { clearTimeout(t); w.terminate(); resolve(ev.data); };
      w.onerror = ev => { clearTimeout(t); w.terminate(); if (ev && ev.preventDefault) ev.preventDefault(); sincrono(); };
      w.postMessage({ nivel: JSON.parse(JSON.stringify(nivel)), opts });
    });
  }
  function panelProfe() {
    const a = App.ajustes(), nivel = App.nivel();
    const niveles = almacen.listar();
    const d = dialogo(`<h2>Profe <button class="btn sec" data-cerrar aria-label="Cerrar">×</button></h2>
      <div class="profe-cols">
      <section><h3>Ajustes</h3>
        <label class="ajuste"><input type="checkbox" id="pEscritor"${a.escritor ? ' checked' : ''}> Modo escritor (frases ocultas)</label>
        <div class="ajuste sub"><label><input type="radio" name="pEscNivel" value="elegir"${a.escritorNivel !== 'escribir' ? ' checked' : ''}> elegir entre 3 (A1)</label> <label><input type="radio" name="pEscNivel" value="escribir"${a.escritorNivel === 'escribir' ? ' checked' : ''}> escribir (A2)</label></div>
        <label class="ajuste"><input type="checkbox" id="pPret"${a.preterito ? ' checked' : ''}> Pretérito (3.º · A2): acciones en indefinido, estados en imperfecto</label>
        <label class="ajuste"><input type="checkbox" id="pClase"${a.clase === true ? ' checked' : ''}${a.modo === 'pizarra' ? '' : ' disabled'}> Barra de clase visible (solo en modo Pizarra)</label>
        <p class="nota">En ★★★ Reto el modo escritor está siempre activo.</p>
        <form id="fNuevaClave" class="ajuste"><label>Nueva contraseña <input type="password" id="pNueva" autocomplete="new-password" minlength="3"></label> <button class="btn sec mini" type="submit">Cambiar</button></form>
      </section>
      <section><h3>Nivel actual: ${esc(nivel.libre ? 'nivel libre' : nivel.titulo)}</h3>
        ${nivel.libre ? '<p class="nota">El nivel libre no tiene solución fija.</p>' : `<p class="nota">Pistas: ${(nivel.pistas || []).map(esc).join(' · ') || 'ninguna'}</p>${nivel.secreto ? `<p class="nota">🔑 Título secreto: <b>${esc(App.tituloSecreto(nivel))}</b></p>` : ''}<div id="pSol"><button class="btn sec" id="bSol">Ver las soluciones</button></div>`}
      </section>
      <section><h3>Niveles de la clase (${niveles.length})</h3>
        <ul class="lista-niv">${niveles.map(n => `<li><span class="cnt">${n.viñetas} ▭</span><span class="tit">${esc(n.titulo)}</span><code>${esc(n.codigo || AU.codificar(n))}</code><button class="btn sec mini" data-abrir="${n.id}">Jugar</button><button class="btn sec mini" data-borrar="${n.id}" aria-label="Borrar">🗑</button></li>`).join('') || '<li class="nota">Todavía no hay niveles creados en este navegador.</li>'}</ul>
        <div class="fila izq"><button class="btn sec" id="bCrear">✎ Crear un nivel</button><button class="btn sec" id="bCodigo">⌨ Importar un código</button><button class="btn sec" id="bExportar"${niveles.length ? '' : ' disabled'}>⬇ Exportar JSON</button><label class="btn sec" for="pImportar">⬆ Importar JSON</label><input type="file" id="pImportar" accept=".json,application/json" hidden></div>
      </section>
      <section><h3>Datos de este navegador</h3>
        <p class="nota">«Borrar mis datos» (en ☰ Niveles) solo borra las estrellas del alumno. Aquí se borra todo: estrellas, ajustes, contraseña, niveles de la clase y equipos.</p>
        <button class="btn rojo" id="bBorrarTodo">Borrar todo</button>
      </section>
      </div>
      <div class="fila"><button class="btn" data-cerrar>Cerrar</button></div>`, 'grande');
    d.querySelector('#pEscritor').addEventListener('change', ev => { a.escritor = ev.target.checked; App.guardar(); App.escritor.reiniciar(); App.pintarTodo(); });
    d.querySelectorAll('input[name="pEscNivel"]').forEach(r => r.addEventListener('change', ev => { a.escritorNivel = ev.target.value; App.guardar(); App.escritor.reiniciar(); App.pintarTodo(); }));
    d.querySelector('#pPret').addEventListener('change', ev => { a.preterito = ev.target.checked; App.guardar(); App.escritor.reiniciar(); App.pintarTodo(); });
    d.querySelector('#pClase').addEventListener('change', ev => { a.clase = ev.target.checked; App.guardar(); const c = $('#clase'); if (c.dataset.montado && a.modo === 'pizarra') c.hidden = !a.clase; App.ajustarTira(); });
    d.querySelector('#fNuevaClave').addEventListener('submit', ev => { ev.preventDefault(); const v = d.querySelector('#pNueva').value.trim(); if (v.length < 3) { App.toast('Mínimo 3 caracteres.'); return; } a.clave = v; App.guardar(); d.querySelector('#pNueva').value = ''; App.toast('Contraseña cambiada.'); });
    const bSol = d.querySelector('#bSol');
    if (bSol) bSol.addEventListener('click', async () => {
      const caja = d.querySelector('#pSol');
      caja.innerHTML = '<p class="nota">Calculando…</p>';
      const r = await resolverAsync(nivel, { max: 60 });
      if (!r) { caja.innerHTML = '<p class="nota">No se pudo calcular aquí (nivel muy grande o navegador sin Worker). Las soluciones de los niveles del juego están en la guía del profe.</p>'; return; }
      const cumpleSecreto = s => !!nivel.secreto && E.simular(nivel, s).secreto;
      const fila = s => `<div class="sol"><button class="btn sec mini" data-sol="${esc(JSON.stringify(s))}">Cargar</button><span>${cumpleSecreto(s) ? '<b title="Cumple también el título secreto">🔑</b> ' : ''}${esc(E.textoSolucion(s))}</span></div>`;
      const primeras = r.soluciones.slice(0, 6);
      const conSecreto = nivel.secreto && !primeras.some(cumpleSecreto) ? r.soluciones.find(cumpleSecreto) : null;
      caja.innerHTML = `<p class="nota">${r.total} ${r.total === 1 ? 'solución' : 'soluciones'}${r.desbordado ? ' (o más)' : ''}${nivel.secreto ? ` · ${r.ambas} con el título secreto 🔑` : ''} · densidad ${(r.densidad * 100).toFixed(2)} %</p>` +
        primeras.map(fila).join('') + (conSecreto ? fila(conSecreto) : '') +
        (nivel.secreto && !primeras.some(cumpleSecreto) && !conSecreto ? '<p class="nota">Ninguna de las primeras 60 soluciones cumple el secreto.</p>' : '');
      caja.querySelectorAll('[data-sol]').forEach(b => b.addEventListener('click', () => { d.close(); App.ponerViñetas(JSON.parse(b.dataset.sol), { silencio: true }); }));
    });
    d.querySelectorAll('[data-abrir]').forEach(b => b.addEventListener('click', () => { d.close(); App.abrirNivel(b.dataset.abrir); }));
    d.querySelectorAll('[data-borrar]').forEach(b => b.addEventListener('click', () => { if (confirm('¿Borrar este nivel de la clase?')) { almacen.borrar(b.dataset.borrar); recargarExtra(); if (App.nivel().id === b.dataset.borrar) App.abrirNivel(C.NIVELES[0].id); panelProfe(); } }));
    d.querySelector('#bCrear').addEventListener('click', () => { d.close(); abrirAutor(); });
    d.querySelector('#bCodigo').addEventListener('click', () => { d.close(); importarCodigo(); });
    d.querySelector('#bBorrarTodo').addEventListener('click', () => { if (confirm('¿Borrar TODO lo que el juego guarda en este navegador (estrellas, ajustes, contraseña, niveles de la clase, equipos)?')) { d.close(); App.borrarTodo(); App.toast('Todo borrado.'); } });
    d.querySelector('#bExportar').addEventListener('click', () => {
      const blob = new Blob([almacen.exportarTodo()], { type: 'application/json' });
      const aEl = el('a', { href: URL.createObjectURL(blob), download: 'cuentalo-niveles.json' });
      document.body.appendChild(aEl); aEl.click(); setTimeout(() => { URL.revokeObjectURL(aEl.href); aEl.remove(); }, 1000);
    });
    d.querySelector('#pImportar').addEventListener('change', ev => {
      const f = ev.target.files && ev.target.files[0]; if (!f) return;
      const lector = new FileReader();
      lector.onload = () => {
        try {
          const datos = JSON.parse(String(lector.result));
          const lista = Array.isArray(datos) ? datos : (datos && Array.isArray(datos.niveles) ? datos.niveles : []);
          const validos = lista.filter(nivelValido), descartados = lista.length - validos.length;
          const k = validos.length ? almacen.importarTodo(JSON.stringify(validos)) : 0;
          recargarExtra();
          App.toast(`${k} ${k === 1 ? 'nivel importado' : 'niveles importados'}${descartados ? ` · ${descartados} no válidos` : ''}.`, 4000);
          panelProfe();
        } catch (e) { App.toast('Este fichero no vale.'); }
      };
      lector.readAsText(f);
    });
  }

  /* =====================================================================
     5. Arranque: ganchos en SVApp
     ===================================================================== */
  App.iniciarModulos = function () {
    recargarExtra();
    App.abrirAutor = abrirAutor;
    App.abrirProfe = abrirProfe;
    App.imprimir = imprimir;
    App.importarCodigo = importarCodigo;
    App.borrarDatos = function () { store.removeItem('cuentalo.autor.v0'); store.removeItem('cuentalo.pizarra.v0'); App.escritor.reiniciar(); autorizado = false; };
    App.alSimular = function (res) {
      if (barra && !barra.hidden) { const b = barra.querySelector('#bGuardar'); if (b) b.disabled = !autorListo(res); if (!App.nivel().enConstruccion) barra.hidden = true; }
    };
    const bi = $('#btnImprimir');
    bi.hidden = false;
    bi.addEventListener('click', imprimir);
  };
})();

</script>
</body>
